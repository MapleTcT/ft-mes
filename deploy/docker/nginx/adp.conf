    }

    location = /msService/SESGISConfig/themeConfig/themeLayers/index {
        default_type text/html;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        alias /usr/share/nginx/module-static/PATROL/patrolMonit/patrol-monit-fallback.html;
    }

    location = /msService/EAM/businessConfig/riskHandle/riskRecord {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Accept-Encoding "";
        proxy_pass $gateway_upstream;
        sub_filter_once on;
        sub_filter '<script type="text/javascript" src="/greenDill/static/scripts/edit.js' '<script type="text/javascript" src="/greenDill/static/scripts/vendors.sesgis.js?v=1677582772048"></script><script type="text/javascript" src="/greenDill/static/scripts/edit.js';
    }

    location = /msService/PATROL/assets/images/comp_icon.png {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream/msService/PATROL/images/comp_icon.png;
    }

    location = /msService/PATROL/patrolTask/taskDetail/abnormalSummary {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Accept-Encoding "";
        proxy_pass $gateway_upstream;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/greenDill/static/PATROL/compat/i18n-value.js"></script><script src="/greenDill/static/PATROL/patrolTask/taskDetail/abnormalSummary/body.js"></script></head>';
    }

    location = /msService/PATROL/patrolRoute/workGroup/workAreaPtEdit {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Accept-Encoding "";
        proxy_pass $gateway_upstream;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/greenDill/static/PATROL/compat/i18n-value.js"></script><script src="/greenDill/static/PATROL/patrolRoute/workGroup/workAreaPtEdit/body.js"></script></head>';
    }

    location = /msService/PATROL/patrolRoute/workArea/workItemPtEdit {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Accept-Encoding "";
        proxy_pass $gateway_upstream;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/greenDill/static/PATROL/compat/i18n-value.js"></script><script src="/greenDill/static/PATROL/patrolRoute/workArea/workItemPtEdit/body.js"></script></head>';
    }

    location ^~ /msService/PATROL/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Accept-Encoding "";
        proxy_pass $gateway_upstream;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/greenDill/static/PATROL/compat/i18n-value.js"></script></head>';
    }

    location ^~ /msService/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location ^~ /auth/realms {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location = /api/auth/users/logout {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location ^~ /inter-api/ws/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location /greenDill/static/license/sso.html {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Allow-Methods 'GET,POST,OPTIONS';
        add_header Access-Control-Allow-Headers 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With';
        try_files $uri =404;
    }

    location ^~ /greenDill/static/workAppointment/ {
        alias /usr/share/nginx/module-static/workAppointment/;
        try_files $uri =404;
    }

    location = /greenDill/static/scripts/list.js {
        default_type application/javascript;
        gzip off;
        gzip_static off;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'else console.error("请将参数放在数组里!")' 'else resolve()';
        sub_filter 'console.error("options中不存在该项!")' 'void 0';
        try_files $uri =404;
    }

    location = /greenDill/static/scripts/edit.js {
        default_type application/javascript;
        gzip off;
        gzip_static off;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        sub_filter_once off;
        sub_filter_types application/javascript;
        sub_filter 'else console.error("请将参数放在数组里!")' 'else resolve()';
        try_files $uri =404;
    }

    location ^~ /greenDill/static/scripts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /greenDill/static/WOM/produceTask/produceTask/makeTaskList/i18n-value.js {
        default_type application/javascript;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        alias /usr/share/nginx/module-static/WOM/produceTask/produceTask/makeTaskList/i18n-value.js;
