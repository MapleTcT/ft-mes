    # New workflow-enabled forms have no deployment yet. The legacy client
    # serializes that state as the literal string "null" and otherwise turns a
    # harmless empty workflow into a page-level 400 error.
    location = /msService/baseService/workflow/flowRoot {
        default_type application/json;
        if ($arg_deploymentid = "null") {
            return 200 '{"code":200,"data":{},"success":true,"message":""}';
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location ^~ /msService/ {
