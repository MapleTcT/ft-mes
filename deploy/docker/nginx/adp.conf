server {
    listen 8080;
    server_name _;

    client_max_body_size 2048m;
    client_body_buffer_size 128k;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 300;
    sendfile off;
    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_comp_level 1;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        application/json
        application/x-javascript
        text/javascript;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8008;
    set $bpi_adapter_upstream http://bpi-adapter:19080;
    set $adp_accept_language $http_accept_language;
    if ($adp_accept_language = "") {
        set $adp_accept_language "zh-CN";
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /bpi {
        return 302 /bpi/;
    }

    location ^~ /bpi/ {
        root /usr/share/nginx;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri $uri/ /bpi/index.html;
    }

    location ^~ /bpi-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $bpi_adapter_upstream;
    }

    location ^~ /open-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location = /inter-api/i18n/v1/resource/code/all/module_ids/allkeyvalues {
        set $i18n_args $args;
        if ($arg_langu_code = "") {
            set $i18n_args "$args&langu_code=zh_CN";
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream$uri?$i18n_args;
    }

    location = /inter-api/i18n/v1/resource/code/all/module_ids/forFrontNoGateWay {
        set $i18n_args $args;
        if ($arg_langu_code = "") {
            set $i18n_args "$args&langu_code=zh_CN";
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream$uri?$i18n_args;
    }

    location ^~ /inter-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location ^~ /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location = /msService/RM/formula/formula/batchFormulaList-query {
        default_type application/json;
        return 200 '{"code":200,"data":{"first":1,"hasNext":false,"hasPre":false,"nextPage":1,"pageNo":1,"pageSize":20,"prePage":1,"result":[],"totalCount":0,"totalPages":0,"treeToSurfaceMode":false},"message":"操作成功"}';
    }

    location ^~ /msService/workAppointment/commonJs/ {
        alias /usr/share/nginx/module-static/workAppointment/commonJs/;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /msService/workAppointment/workPlan/workTicketPlan/workPlanEdit {
        default_type text/html;
        alias /usr/share/nginx/module-static/workAppointment/workPlan/workTicketPlan/workPlanEdit.html;
    }

    location = /msService/workAppointment/workPlan/workTicketPlan/workPlanList {
        default_type text/html;
        alias /usr/share/nginx/module-static/workAppointment/workPlan/workTicketPlan/workPlanList.html;
    }

    location = /msService/workAppointment/workPlan/workTicketPlan/workPlanView {
        default_type text/html;
