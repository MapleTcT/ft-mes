server {
    listen 8080;
    server_name _;

    client_max_body_size 2048m;
    client_body_buffer_size 128k;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 300;
    sendfile off;
    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_comp_level 1;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        application/json
        application/x-javascript
        text/javascript;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8008;
    set $bpi_adapter_upstream http://bpi-adapter:19080;
    set $rm_export_upstream http://rm-export-compat:18090;
    set $rm_formula_editor_upstream http://rm-formula-editor:8080;
    set $wom_print_upstream http://wom-print:8080;
    set $wom_production_entry_upstream http://wom-production-entry:8080;
    set $wom_quality_reporting_upstream http://wom-quality-reporting:8080;
    set $adp_accept_language $http_accept_language;
    if ($adp_accept_language = "") {
        set $adp_accept_language "zh-CN";
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /bpi {
        return 302 /bpi/;
    }

    location ^~ /bpi/ {
        root /usr/share/nginx;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri $uri/ /bpi/index.html;
    }

    location ^~ /bpi-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $bpi_adapter_upstream;
    }

    location = /inter-api/rbac/v1/menus/currentUser {
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @adp_gateway_current_user_menu;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $bpi_adapter_upstream/bpi-shell/menus/currentUser;
    }

    location @adp_gateway_current_user_menu {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $gateway_upstream;
    }

    location ^~ /open-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location = /inter-api/i18n/v1/resource/code/all/module_ids/allkeyvalues {
        set $i18n_args $args;
        if ($arg_langu_code = "") {
            set $i18n_args "$args&langu_code=zh_CN";
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream$uri?$i18n_args;
    }

    location = /inter-api/i18n/v1/resource/code/all/module_ids/forFrontNoGateWay {
        set $i18n_args $args;
        if ($arg_langu_code = "") {
            set $i18n_args "$args&langu_code=zh_CN";
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream$uri?$i18n_args;
    }

    location ^~ /inter-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location ^~ /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_pass $gateway_upstream;
    }

    location = /_adp_rm_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $gateway_upstream/inter-api/rbac/v1/menus/currentUser;
    }

    # The HTML shell contains no business data and is opened by window.open,
    # which cannot copy the localStorage ticket into a navigation header.
    # The page adds that ticket to every API request; the API remains protected.
    location = /msService/RM/formula/editor {
        default_type text/html;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        alias /usr/share/nginx/module-static/RM/formula/editor.html;
    }

    location ^~ /msService/RM/formula-editor/ {
        auth_request /_adp_rm_auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header X-ADP-Auth-Checked "1";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $rm_formula_editor_upstream;
    }

    location = /_adp_wom_print_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Accept "application/json";
        proxy_set_header Accept-Language "zh-CN";
        proxy_set_header langu_code "zh_CN";
        proxy_set_header X-Tenant-Id "dt";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $gateway_upstream/inter-api/rbac/v1/menus/currentUser;
    }

    location = /_adp_wom_production_entry_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Accept "application/json";
        proxy_set_header Accept-Language "zh-CN";
        proxy_set_header langu_code "zh_CN";
        proxy_set_header X-Tenant-Id "dt";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $gateway_upstream/inter-api/rbac/v1/menus/currentUser;
    }

    # This document contains no business data. It must be reachable by a normal
    # window.open navigation, which cannot copy the token from localStorage into
    # an Authorization header. The APIs below remain protected and the page
    # attaches the same-origin login ticket to every data request.
    location = /msService/WOM/produceTask/manual-entry/page {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate" always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $wom_production_entry_upstream;
    }

    location ^~ /msService/WOM/produceTask/manual-entry/ {
        auth_request /_adp_wom_production_entry_auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header X-Tenant-Id "default";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $wom_production_entry_upstream;
    }

    location ^~ /msService/WOM/quality-quantity/ {
        auth_request /_adp_wom_production_entry_auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $adp_accept_language;
        proxy_set_header X-Tenant-Id "default";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass $wom_quality_reporting_upstream;
    }

    location ^~ /msService/WOM/printManage/ {
        auth_request /_adp_wom_print_auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
