x-app-env: &app-env
  TZ: ${TZ:-Asia/Shanghai}
  SPRING_PROFILES_ACTIVE: prod
  NACOS_HOST: nacos
  NACOS_PORT: "8848"
  nacos: nacos
  SUPOS_NACOS_ADDRESS: ${SUPOS_NACOS_ADDRESS:-nacos:8848}
  SUPOS_NACOS_USERNAME: ${SUPOS_NACOS_USERNAME:-nacos}
  SUPOS_NACOS_PASSWORD: ${SUPOS_NACOS_PASSWORD:-nacos}
  SUPOS_NACOS_REGISTRY_GROUP: ${SUPOS_NACOS_REGISTRY_GROUP:-prod}
  CLOUD_DISCOVERY_GROUP: ${CLOUD_DISCOVERY_GROUP:-prod}
  I18N_HOST: ${I18N_HOST:-i18n}
  I18N_PORT: ${I18N_PORT:-8080}
  SUPOS_ADDRESS: ${SUPOS_ADDRESS:-http://100.99.133.43:18080}
  SUPOS_SYSTEM_DB_TYPE: ${SUPOS_SYSTEM_DB_TYPE:-postgresql}
  SUPOS_SYSTEM_DB_USE: ${SUPOS_SYSTEM_DB_USE:-true}
  SUPOS_SYSTEM_DB_NAME: ${SUPOS_SYSTEM_DB_NAME:-adp}
  SUPOS_SYSTEM_DB_HOST: ${SUPOS_SYSTEM_DB_HOST:-postgres}
  SUPOS_SYSTEM_DB_PORT: ${SUPOS_SYSTEM_DB_PORT:-5432}
  SUPOS_SYSTEM_DB_USERNAME: ${SUPOS_SYSTEM_DB_USERNAME:-adp}
  SUPOS_SYSTEM_DB_PASSWORD: ${SUPOS_SYSTEM_DB_PASSWORD:-adp123456}
  SUPOS_SUPPLANT_DBTYPE: ${SUPOS_SYSTEM_DB_TYPE:-postgresql}
  SUPOS_SUPPLANT_DBNAME: ${SUPOS_SYSTEM_DB_NAME:-adp}
  SUPOS_SUPPLANT_HOST: ${SUPOS_SYSTEM_DB_HOST:-postgres}
  SUPOS_SUPPLANT_PORT: ${SUPOS_SYSTEM_DB_PORT:-5432}
  SUPOS_SUPPLANT_USERNAME: ${SUPOS_SYSTEM_DB_USERNAME:-adp}
  SUPOS_SUPPLANT_PASSWORD: ${SUPOS_SYSTEM_DB_PASSWORD:-adp123456}
  SUPOS_FUSION_DINGTALK_DBNAME: ${SUPOS_SYSTEM_DB_NAME:-adp}
  SUPOS_FUSION_DINGTALK_HOST: ${SUPOS_SYSTEM_DB_HOST:-postgres}
  SUPOS_FUSION_DINGTALK_PORT: ${SUPOS_SYSTEM_DB_PORT:-5432}
  SUPOS_FUSION_DINGTALK_USERNAME: ${SUPOS_SYSTEM_DB_USERNAME:-adp}
  SUPOS_FUSION_DINGTALK_PASSWORD: ${SUPOS_SYSTEM_DB_PASSWORD:-adp123456}
  SUPOS_FUSION_WECHAT_DBNAME: ${SUPOS_SYSTEM_DB_NAME:-adp}
  SUPOS_FUSION_WECHAT_HOST: ${SUPOS_SYSTEM_DB_HOST:-postgres}
  SUPOS_FUSION_WECHAT_PORT: ${SUPOS_SYSTEM_DB_PORT:-5432}
  SUPOS_FUSION_WECHAT_USERNAME: ${SUPOS_SYSTEM_DB_USERNAME:-adp}
  SUPOS_FUSION_WECHAT_PASSWORD: ${SUPOS_SYSTEM_DB_PASSWORD:-adp123456}
  VALIDATIONQUERYSQL: ${VALIDATIONQUERYSQL:-SELECT 1}
  SUPOS_REDIS_HOST: ${SUPOS_REDIS_HOST:-redis}
  SUPOS_REDIS_PORT: ${SUPOS_REDIS_PORT:-6379}
  SUPOS_REDIS_CLUSTER_NODES: ${SUPOS_REDIS_CLUSTER_NODES:-redis:6379}
  SUPPLANT_LICENSE_ENABLED: ${SUPPLANT_LICENSE_ENABLED:-true}
  SUPOS_KAFKA_BROKERS: ${SUPOS_KAFKA_BROKERS:-kafka:9092}
  SUPOS_ZOOKEEPER_NODES: ${SUPOS_ZOOKEEPER_NODES:-zookeeper:2181}
  SUPOS_MINIO_ENDPOINT: ${SUPOS_MINIO_ENDPOINT:-http://minio:30200}
  SUPOS_MINIO_ACCESS_KEY: ${SUPOS_MINIO_ACCESS_KEY:-adpminio}
  SUPOS_MINIO_SECRET_KEY: ${SUPOS_MINIO_SECRET_KEY:-adpminio123}
  SUPOS_MINIO_CLUSTER_NODES: ${SUPOS_MINIO_CLUSTER_NODES:-minio:30200}
  SUPOS_MINIO_IP: ${SUPOS_MINIO_IP:-minio}
  SUPOS_MINIO_PORT: ${SUPOS_MINIO_PORT:-30200}
  SUPOS_MINIO_ACCESSKEY: ${SUPOS_MINIO_ACCESSKEY:-adpminio}
  SUPOS_MINIO_SECRETKEY: ${SUPOS_MINIO_SECRETKEY:-adpminio123}
  INTEGRATION_SUPOS_ENABLED: ${INTEGRATION_SUPOS_ENABLED:-false}
  WOM_MES_PRO_BATCH: ${WOM_MES_PRO_BATCH:-false}
  QCS_AUTO_UNQLF_DEAL: ${QCS_AUTO_UNQLF_DEAL:-manu}
  ADP_REMOTE_I18N_LOG_LEVEL: ${ADP_REMOTE_I18N_LOG_LEVEL:-OFF}
  ADP_SWAGGER_LOG_LEVEL: ${ADP_SWAGGER_LOG_LEVEL:-OFF}
  MONGO_USERNAME: ${MONGO_USERNAME:-root}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-adpmongo123}
  MONGO_HOST: ${MONGO_HOST:-mongo}
  MONGO_PORT: ${MONGO_PORT:-27017}
  MONGO_DBNAME: ${MONGO_DBNAME:-supfusion}
  MONGO_AUTH_DBNAME: ${MONGO_AUTH_DBNAME:-admin}
  ADP_PUBLIC_HOST: ${ADP_PUBLIC_HOST:-100.99.133.43}
  ADP_HTTP_PORT: ${ADP_HTTP_PORT:-18080}
  JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -Dfile.encoding=utf-8 -Duser.timezone=Asia/Shanghai}
  JAVA_TOOL_OPTIONS: -Dfile.encoding=utf-8 -Duser.timezone=Asia/Shanghai
  "db-type": ${SUPOS_SYSTEM_DB_TYPE:-postgresql}

x-java-service: &java-service
  image: ${ADP_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jre}
  restart: unless-stopped
  working_dir: /opt/adp
  environment: *app-env
  volumes:
    - ../../runtime/bap-server:/opt/adp/bap-server
    - ../../runtime/postgres-sql:/opt/adp/sql:ro
    - ../../runtime/bap-server/assembly/repository/maven/org/postgresql/postgresql/42.2.8/postgresql-42.2.8.jar:/opt/adp/drivers/postgresql.jar:ro
    - ../../runtime/logs:/opt/adp/logs
    - ./assets/fileServer/initFile:/root/initFile:ro
    - ./patches/scdog-test-bypass/lib/libSCDog.so:/opt/adp/lib/libSCDog.so:ro
    - ./scripts/run-service.sh:/opt/adp/bin/run-service.sh:ro
  depends_on:
    nacos:
      condition: service_started
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_started
    mongo:
      condition: service_started

services:
  postgres:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adp}
      POSTGRES_USER: ${POSTGRES_USER:-adp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adp123456}
      BPI_DATABASE_NAME: ${BPI_DATABASE_NAME:-ft_mes_bpi}
      BPI_DATABASE_PASSWORD: ${BPI_DATABASE_PASSWORD:-bpi-dev-only-change-me}
      BPI_MIGRATOR_PASSWORD: ${BPI_MIGRATOR_PASSWORD:-bpi-migrator-dev-only-change-me}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adp} -d ${POSTGRES_DB:-adp}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-m.daocloud.io/docker.io/library/redis:6-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  test-license-seed:
    image: ${REDIS_IMAGE:-m.daocloud.io/docker.io/library/redis:6-alpine}
    restart: "no"
    environment:
      ADP_SEED_TEST_LICENSE: ${ADP_SEED_TEST_LICENSE:-true}
      ADP_REDIS_HOST: redis
      ADP_REDIS_PORT: "6379"
      ADP_TEST_LOGIN_LIMIT: ${ADP_TEST_LOGIN_LIMIT:-255}
    volumes:
      - ./scripts/seed-test-license.sh:/work/seed-test-license.sh:ro
    entrypoint: ["/bin/sh", "/work/seed-test-license.sh"]
    depends_on:
      redis:
        condition: service_healthy

  zookeeper:
    image: ${ADP_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jre}
    restart: unless-stopped
    working_dir: /opt/adp/bap-server/assembly/zookeeper
    command:
      - sh
      - -c
      - mkdir -p ../tmp/zookeeper /opt/adp/logs/zookeeper && java -Dzookeeper.log.dir=/opt/adp/logs/zookeeper -cp "zookeeper-3.4.10.jar:lib/*:conf" org.apache.zookeeper.server.quorum.QuorumPeerMain conf/zoo.cfg
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ../../runtime/bap-server:/opt/adp/bap-server
      - ../../runtime/logs:/opt/adp/logs

  kafka:
    image: ${ADP_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jre}
    restart: unless-stopped
    working_dir: /opt/adp/bap-server/assembly/kafka_2
    command:
      - sh
      - -c
      - mkdir -p /opt/adp/kafka-data /opt/adp/logs/kafka && chmod +x bin/*.sh && exec bin/kafka-server-start.sh config/server.properties --override zookeeper.connect=zookeeper:2181 --override listeners=PLAINTEXT://:9092 --override advertised.listeners=PLAINTEXT://kafka:9092 --override log.dirs=/opt/adp/kafka-data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ../../runtime/bap-server:/opt/adp/bap-server
      - ../../runtime/logs:/opt/adp/logs
      - kafka-data:/opt/adp/kafka-data
    depends_on:
      - zookeeper

  mongo:
    image: ${MONGO_IMAGE:-m.daocloud.io/docker.io/library/mongo:4.4}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-adpmongo123}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mongo-data:/data/db

  nacos:
    image: ${ADP_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jre}
    restart: unless-stopped
    working_dir: /opt/adp/bap-server/assembly/nacos-1.2.1
    command:
      - sh
      - -c
      - mkdir -p logs && exec java -Xms256m -Xmx512m -Xmn128m -Dnacos.standalone=true -jar target/nacos-server.jar
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ADP_NACOS_PORT:-18848}:8848"
    volumes:
      - ../../runtime/bap-server:/opt/adp/bap-server

  nacos-config:
    image: ${CURL_IMAGE:-m.daocloud.io/docker.io/curlimages/curl:8.17.0}
    restart: "no"
    working_dir: /work
    environment: *app-env
    volumes:
      - ./nacos-rendered:/work/nacos-rendered:ro
      - ./scripts/publish-nacos-configs.sh:/work/publish-nacos-configs.sh:ro
    entrypoint: ["/bin/sh", "/work/publish-nacos-configs.sh"]
    depends_on:
      - nacos

  keycloak:
    image: ${ADP_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jre}
    restart: unless-stopped
    working_dir: /opt/keycloak
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      SUPOS_NACOS_ADDRESS: ${SUPOS_NACOS_ADDRESS:-nacos:8848}
    command: ["sh", "-c", "mkdir -p /opt/jboss && ln -sfn /opt/keycloak /opt/jboss/keycloak && chmod +x /opt/keycloak/bin/*.sh && (/opt/keycloak/bin/add-user-keycloak.sh -u \"$${KEYCLOAK_USER:-admin}\" -p \"$${KEYCLOAK_PASSWORD:-admin}\" || true) && exec /opt/keycloak/bin/standalone.sh -b 0.0.0.0 -Djboss.http.port=8080 -Dnacos.address=nacos:8848 -Dnacos.group=prod -Dauthkeycloak.port=8080"]
    volumes:
      - ../../runtime/bap-server/assembly/keycloak-10.0.1:/opt/keycloak

  minio:
    image: ${MINIO_IMAGE:-m.daocloud.io/docker.io/minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--address", ":30200", "--console-address", ":30201"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adpminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adpminio123}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - minio-data:/data

  websocket:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/websocket/supfusion-websocket.jar", "com.supcon.supfusion.ws.Application", "--nacos.server-addr=nacos:8848"]

  i18n:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/i18n/supfusion-i18n.jar"]
    networks:
      default:
        aliases:
          - i18n-service

  sysmanagement:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/sysmanagement/supfusion-sysmanagement.jar"]

  basicmanagement:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/basicmanagement/supfusion-basicmanagement.jar"]

  orgmanagement:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/orgmanagement/supfusion-orgmanagement.jar"]

  iam:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/iam/supfusion-iam.jar"]
    depends_on:
      keycloak:
        condition: service_started
      nacos:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/gateway/supos-gateway.jar"]
    ports:
      - "${ADP_GATEWAY_PORT:-18008}:8008"
    depends_on:
      keycloak:
        condition: service_started
      nacos:
        condition: service_started
      redis:
        condition: service_healthy

  license:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/license/supfusion-license.jar"]

  configuration:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/configuration/supfusion-configuration.jar"]

  operatetools:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/operatetools/supfusion-operatetools.jar"]

  baseService:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/baseService/supfusion-baseservice.jar"]

  flow:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/flow/supfusion-flow.jar"]

  notification-admin:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-admin/notification-admin.jar"]

  notification-apiserver:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-apiserver/notification-apiserver.jar"]

  notification-engine:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-engine/notification-engine.jar"]

  fileServer:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/fileServer/supfusion-file-server.jar"]
    depends_on:
      minio:
        condition: service_started
      nacos:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  task-scheduler:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/task-scheduler/supfusion-task-scheduler-service.jar"]

  customProperty:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/customProperty/custom-property.jar"]

  adp-admin:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/adp-admin/adp-admin.jar"]

  excel-server:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/excel-server/excel-server.jar"]

  msgmanagement:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/msgmanagement/supfusion-msgmanagement.jar"]

  notification-app:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-app/notification-app.jar"]

  notification-dingtalk:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-dingtalk/notification-dingtalk.jar"]

  notification-mobile:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-mobile/notification-mobile.jar"]

  notification-sms-jincang:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-sms-jincang/notification-sms-jincang.jar"]

  notification-wechat:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/notification-wechat/notification-wechat.jar"]

  printer:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/printer/supfusion-printer.jar"]

  auditlog:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/base-Server/auditlog/supfusion-auditlog.jar"]

  craftGraphMs:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/module-Server/craftGraphMs/manual/craftGraphMs-1.0.0.jar"]

  RMMs:
    <<: *java-service
    environment:
      <<: *app-env
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx1024m -Dfile.encoding=utf-8 -Duser.timezone=Asia/Shanghai} -DRM/RM.Batch.username=${RM_BATCH_USERNAME:-admin} -DRM/RM.Batch.password=${RM_BATCH_PASSWORD:-123456} -DRM/RM.MQ.brokerUrl=${RM_BATCH_MQ_BROKER_HOST:-localhost}"
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/module-Server/RMMs/manual/RMMs-1.0.0.jar"]

  rm-formula-editor:
    <<: *java-service
    environment:
      <<: *app-env
      RM_FORMULA_EDITOR_PORT: "8080"
      RM_FORMULA_EDITOR_DB_POOL_SIZE: ${RM_FORMULA_EDITOR_DB_POOL_SIZE:-8}
      RM_FORMULA_EDITOR_TENANT_ID: ${RM_FORMULA_EDITOR_TENANT_ID:-default}
      RM_FORMULA_DELIVERY_URL: ${RM_FORMULA_DELIVERY_URL:-}
      RM_FORMULA_DELIVERY_TOKEN: ${RM_FORMULA_DELIVERY_TOKEN:-}
      RM_FORMULA_SIMULATOR_ENABLED: ${RM_FORMULA_SIMULATOR_ENABLED:-false}
      RM_FORMULA_SIMULATOR_SECRET: ${RM_FORMULA_SIMULATOR_SECRET:-disabled}
      RM_FORMULA_SIMULATOR_FAIL_FIRST: ${RM_FORMULA_SIMULATOR_FAIL_FIRST:-false}
      JAVA_OPTS: ${RM_FORMULA_EDITOR_JAVA_OPTS:--Xms128m -Xmx512m -Dfile.encoding=utf-8 -Duser.timezone=Asia/Shanghai}
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/module-Server/RMFormulaEditor/manual/rm-formula-editor.jar"]

  rm-export-compat:
    image: ${ADP_JAVA_BUILD_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jdk}
    restart: unless-stopped
    working_dir: /opt/adp/rm-export-compat
    environment:
      <<: *app-env
      RM_EXPORT_PORT: "18090"
      RM_EXPORT_MAX_ROWS: ${RM_EXPORT_MAX_ROWS:-5000}
      RM_EXPORT_MAX_REQUEST_BYTES: ${RM_EXPORT_MAX_REQUEST_BYTES:-1048576}
      RM_EXPORT_THREADS: ${RM_EXPORT_THREADS:-4}
      RM_EXPORT_QUERY_TIMEOUT_SECONDS: ${RM_EXPORT_QUERY_TIMEOUT_SECONDS:-30}
    volumes:
      - ./compat/rm-export:/opt/adp/rm-export-compat:ro
      - ../../runtime/bap-server/assembly/repository/maven/org/postgresql/postgresql/42.2.8/postgresql-42.2.8.jar:/opt/adp/drivers/postgresql.jar:ro
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/rm-export-compat
        javac -encoding UTF-8 -cp /opt/adp/drivers/postgresql.jar -d /tmp/rm-export-compat RmFormulaExportCompatServer.java
        exec java -cp /tmp/rm-export-compat:/opt/adp/drivers/postgresql.jar RmFormulaExportCompatServer
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18090'"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  WOMMs:
    <<: *java-service
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/module-Server/WOMMs/manual/WOMMs-1.0.0.jar"]

  wom-print:
    <<: *java-service
    environment:
      <<: *app-env
      WOM_PRINT_PORT: "8080"
      WOM_PRINT_TENANT_ID: ${WOM_PRINT_TENANT_ID:-default}
      JAVA_OPTS: ${WOM_PRINT_JAVA_OPTS:--Xms128m -Xmx512m -Dfile.encoding=utf-8 -Duser.timezone=Asia/Shanghai}
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/module-Server/WOMPrint/manual/wom-print.jar"]

  wom-production-entry:
    <<: *java-service
    environment:
      <<: *app-env
      WOM_PRODUCTION_ENTRY_PORT: "8080"
      WOM_PRODUCTION_ENTRY_TENANT_ID: ${WOM_PRODUCTION_ENTRY_TENANT_ID:-default}
      WOM_PRODUCTION_ENTRY_UPSTREAM_BASE_URL: ${WOM_PRODUCTION_ENTRY_UPSTREAM_BASE_URL:-http://gateway:8008}
      JAVA_OPTS: ${WOM_PRODUCTION_ENTRY_JAVA_OPTS:--Xms128m -Xmx512m -Dfile.encoding=utf-8 -Duser.timezone=Asia/Shanghai}
    command: ["sh", "/opt/adp/bin/run-service.sh", "/opt/adp/bap-server/module-Server/WOMProductionEntry/manual/wom-production-entry.jar"]

  wom-quality-reporting:
    <<: *java-service
    environment:
      <<: *app-env
