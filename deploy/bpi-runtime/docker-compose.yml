name: ${COMPOSE_PROJECT_NAME:-ft-mes-bpi-runtime}

services:
  bpi-postgres:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-bpi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BPI_DATABASE_NAME: ${BPI_DATABASE_NAME:-ft_mes_bpi}
      BPI_DATABASE_PASSWORD: ${BPI_DATABASE_PASSWORD:?BPI_DATABASE_PASSWORD is required}
      BPI_MIGRATOR_PASSWORD: ${BPI_MIGRATOR_PASSWORD:?BPI_MIGRATOR_PASSWORD is required}
      BPI_MATERIALIZER_DATABASE_PASSWORD: ${BPI_MATERIALIZER_DATABASE_PASSWORD:?BPI_MATERIALIZER_DATABASE_PASSWORD is required}
      BPI_CATALOG_PUBLISHER_DATABASE_PASSWORD: ${BPI_CATALOG_PUBLISHER_DATABASE_PASSWORD:?BPI_CATALOG_PUBLISHER_DATABASE_PASSWORD is required}
      BPI_RETENTION_ARCHIVER_DATABASE_PASSWORD: ${BPI_RETENTION_ARCHIVER_DATABASE_PASSWORD:?BPI_RETENTION_ARCHIVER_DATABASE_PASSWORD is required}
      BPI_MLFLOW_REGISTRAR_DATABASE_PASSWORD: ${BPI_MLFLOW_REGISTRAR_DATABASE_PASSWORD:?BPI_MLFLOW_REGISTRAR_DATABASE_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - bpi-postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init/176-bpi-database-role.sh:/docker-entrypoint-initdb.d/010-bpi-database-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpi_admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - bpi-runtime

  bpi-minio:
    image: ${MINIO_IMAGE:-m.daocloud.io/docker.io/minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - bpi-minio-data:/data
    networks:
      - bpi-runtime

  bpi-dataset-minio-bootstrap:
    image: ${MINIO_MC_IMAGE:-m.daocloud.io/docker.io/minio/mc:latest}
    restart: "no"
    environment:
      BPI_DATASET_BUCKET_BOOTSTRAP_ENABLED: ${BPI_DATASET_BUCKET_BOOTSTRAP_ENABLED:-false}
      BPI_DATASET_MINIO_ENDPOINT: http://bpi-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      BPI_DATASET_MINIO_ACCESS_KEY: ${BPI_DATASET_MINIO_ACCESS_KEY:?BPI_DATASET_MINIO_ACCESS_KEY is required}
      BPI_DATASET_MINIO_SECRET_KEY: ${BPI_DATASET_MINIO_SECRET_KEY:?BPI_DATASET_MINIO_SECRET_KEY is required}
      BPI_DATASET_MINIO_BUCKET: ${BPI_DATASET_MINIO_BUCKET:-bpi-datasets}
      BPI_DATASET_SOURCE_READER_ENABLED: ${BPI_DATASET_SOURCE_READER_ENABLED:-false}
      BPI_DATASET_SOURCE_READER_ACCESS_KEY: ${BPI_DATASET_SOURCE_READER_ACCESS_KEY:-_DISABLED_}
      BPI_DATASET_SOURCE_READER_SECRET_KEY: ${BPI_DATASET_SOURCE_READER_SECRET_KEY:-_DISABLED_}
    volumes:
      - ../minio/bootstrap-bpi-dataset-bucket.sh:/work/bootstrap.sh:ro
      - ../minio/bpi-dataset-materializer-policy.json:/work/policy.json:ro
      - ../minio/bpi-dataset-catalog-source-reader-policy.json:/work/source-reader-policy.json:ro
    entrypoint: ["/bin/sh", "/work/bootstrap.sh"]
    depends_on:
      bpi-minio:
        condition: service_started
    networks:
      - bpi-runtime

  bpi-iceberg-warehouse-bootstrap:
    image: ${MINIO_MC_IMAGE:-m.daocloud.io/docker.io/minio/mc:latest}
    profiles: ["bpi-catalog"]
    restart: "no"
    environment:
      BPI_ICEBERG_WAREHOUSE_BOOTSTRAP_ENABLED: ${BPI_ICEBERG_WAREHOUSE_BOOTSTRAP_ENABLED:-false}
      BPI_ICEBERG_MINIO_ENDPOINT: http://bpi-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      BPI_ICEBERG_MINIO_ACCESS_KEY: ${BPI_ICEBERG_MINIO_ACCESS_KEY:?BPI_ICEBERG_MINIO_ACCESS_KEY is required}
      BPI_ICEBERG_MINIO_SECRET_KEY: ${BPI_ICEBERG_MINIO_SECRET_KEY:?BPI_ICEBERG_MINIO_SECRET_KEY is required}
      BPI_ICEBERG_WAREHOUSE_BUCKET: ${BPI_ICEBERG_WAREHOUSE_BUCKET:-bpi-iceberg-warehouse}
    volumes:
      - ../minio/bootstrap-bpi-iceberg-warehouse.sh:/work/bootstrap.sh:ro
      - ../minio/bpi-iceberg-warehouse-policy.json:/work/policy.json:ro
    entrypoint: ["/bin/sh", "/work/bootstrap.sh"]
    depends_on:
      bpi-minio:
        condition: service_started
    networks:
      - bpi-runtime

  bpi-dataset-recovery-bootstrap:
    image: ${MINIO_MC_IMAGE:-m.daocloud.io/docker.io/minio/mc:latest}
    profiles: ["bpi-catalog"]
    restart: "no"
    environment:
      BPI_DATASET_RECOVERY_BUCKET_BOOTSTRAP_ENABLED: ${BPI_DATASET_RECOVERY_BUCKET_BOOTSTRAP_ENABLED:-false}
      BPI_DATASET_RETENTION_MINIO_ENDPOINT: http://bpi-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      BPI_DATASET_RETENTION_MINIO_ACCESS_KEY: ${BPI_DATASET_RETENTION_MINIO_ACCESS_KEY:?BPI_DATASET_RETENTION_MINIO_ACCESS_KEY is required}
      BPI_DATASET_RETENTION_MINIO_SECRET_KEY: ${BPI_DATASET_RETENTION_MINIO_SECRET_KEY:?BPI_DATASET_RETENTION_MINIO_SECRET_KEY is required}
      BPI_DATASET_RECOVERY_MINIO_ACCESS_KEY: ${BPI_DATASET_RECOVERY_MINIO_ACCESS_KEY:?BPI_DATASET_RECOVERY_MINIO_ACCESS_KEY is required}
      BPI_DATASET_RECOVERY_MINIO_SECRET_KEY: ${BPI_DATASET_RECOVERY_MINIO_SECRET_KEY:?BPI_DATASET_RECOVERY_MINIO_SECRET_KEY is required}
      BPI_DATASET_MINIO_BUCKET: ${BPI_DATASET_MINIO_BUCKET:-bpi-datasets}
      BPI_DATASET_RECOVERY_BUCKET: ${BPI_DATASET_RECOVERY_BUCKET:-bpi-dataset-recovery}
      BPI_ICEBERG_WAREHOUSE_BUCKET: ${BPI_ICEBERG_WAREHOUSE_BUCKET:-bpi-iceberg-warehouse}
      BPI_DATASET_RETENTION_MODE: ${BPI_DATASET_RETENTION_MODE:-GOVERNANCE}
      BPI_DATASET_RETENTION_DAYS: ${BPI_DATASET_RETENTION_DAYS:-30}
    volumes:
      - ../minio/bootstrap-bpi-dataset-recovery-bucket.sh:/work/bootstrap.sh:ro
      - ../minio/bpi-dataset-retention-archiver-policy.json:/work/policy.json:ro
      - ../minio/bpi-dataset-recovery-operator-policy.json:/work/recovery-policy.json:ro
    entrypoint: ["/bin/sh", "/work/bootstrap.sh"]
    depends_on:
      bpi-minio:
        condition: service_started
      bpi-dataset-minio-bootstrap:
        condition: service_completed_successfully
      bpi-iceberg-warehouse-bootstrap:
        condition: service_completed_successfully
    networks:
      - bpi-runtime

  bpi-polaris-postgres:
    image: ${BPI_POLARIS_POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:16.13-alpine}
    profiles: ["bpi-catalog"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${BPI_POLARIS_DATABASE_PASSWORD:?BPI_POLARIS_DATABASE_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - bpi-polaris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - bpi-runtime

  bpi-polaris-bootstrap-check:
    image: ${BPI_POLARIS_POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:16.13-alpine}
    profiles: ["bpi-catalog"]
    restart: "no"
    environment:
      PGHOST: bpi-polaris-postgres
      PGPORT: "5432"
      PGDATABASE: polaris
      PGUSER: polaris
      PGPASSWORD: ${BPI_POLARIS_DATABASE_PASSWORD:?BPI_POLARIS_DATABASE_PASSWORD is required}
      BPI_POLARIS_REALM: ${BPI_POLARIS_REALM:-POLARIS}
      BPI_POLARIS_BOOTSTRAP_CLIENT_ID: ${BPI_POLARIS_BOOTSTRAP_CLIENT_ID:?BPI_POLARIS_BOOTSTRAP_CLIENT_ID is required}
    volumes:
      - ../polaris/check_metastore_bootstrap.sh:/work/check-metastore-bootstrap.sh:ro
      - bpi-polaris-bootstrap-state:/var/run/bpi-polaris-bootstrap
    entrypoint: ["/bin/sh", "/work/check-metastore-bootstrap.sh"]
    depends_on:
      bpi-polaris-postgres:
        condition: service_healthy
    networks:
      - bpi-runtime

  bpi-polaris-bootstrap:
    image: ${BPI_POLARIS_ADMIN_IMAGE:-apache/polaris-admin-tool:1.4.1}
    profiles: ["bpi-catalog"]
    restart: "no"
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://bpi-polaris-postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${BPI_POLARIS_DATABASE_PASSWORD:?BPI_POLARIS_DATABASE_PASSWORD is required}
      BPI_POLARIS_BOOTSTRAP_STATE_FILE: /var/run/bpi-polaris-bootstrap/metastore-state
      BPI_POLARIS_REALM: ${BPI_POLARIS_REALM:-POLARIS}
      BPI_POLARIS_BOOTSTRAP_CLIENT_ID: ${BPI_POLARIS_BOOTSTRAP_CLIENT_ID:?BPI_POLARIS_BOOTSTRAP_CLIENT_ID is required}
      BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET: ${BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET:?BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET is required}
    volumes:
      - ../polaris/bootstrap_metastore_if_required.sh:/work/bootstrap-metastore-if-required.sh:ro
      - bpi-polaris-bootstrap-state:/var/run/bpi-polaris-bootstrap:ro
    entrypoint: ["/bin/sh", "/work/bootstrap-metastore-if-required.sh"]
    command: ["bootstrap"]
    depends_on:
      bpi-polaris-bootstrap-check:
        condition: service_completed_successfully
    networks:
      - bpi-runtime

  bpi-polaris:
    image: ${BPI_POLARIS_IMAGE:-apache/polaris:1.4.1}
    profiles: ["bpi-catalog"]
    restart: unless-stopped
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://bpi-polaris-postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${BPI_POLARIS_DATABASE_PASSWORD:?BPI_POLARIS_DATABASE_PASSWORD is required}
      POLARIS_REALM_CONTEXT_REALMS: ${BPI_POLARIS_REALM:-POLARIS}
      POLARIS_REALM_CONTEXT_REQUIRE_HEADER: "true"
      POLARIS_BOOTSTRAP_CREDENTIALS: ${BPI_POLARIS_REALM:-POLARIS},${BPI_POLARIS_BOOTSTRAP_CLIENT_ID:?BPI_POLARIS_BOOTSTRAP_CLIENT_ID is required},${BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET:?BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET is required}
      POLARIS_AUTHENTICATION_TOKEN_BROKER_TYPE: symmetric-key
      POLARIS_AUTHENTICATION_TOKEN_BROKER_SYMMETRIC_KEY_SECRET: ${BPI_POLARIS_TOKEN_BROKER_SECRET:?BPI_POLARIS_TOKEN_BROKER_SECRET is required}
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": ${BPI_POLARIS_ALLOW_INSECURE_STORAGE_TYPES:-false}
      polaris.features."DROP_WITH_PURGE_ENABLED": ${BPI_POLARIS_DROP_WITH_PURGE_ENABLED:-false}
      polaris.readiness.ignore-severe-issues: ${BPI_POLARIS_IGNORE_SEVERE_READINESS_ISSUES:-false}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      QUARKUS_LOG_FILE_ENABLED: "false"
      AWS_REGION: ${BPI_ICEBERG_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${BPI_ICEBERG_MINIO_ACCESS_KEY:?BPI_ICEBERG_MINIO_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${BPI_ICEBERG_MINIO_SECRET_KEY:?BPI_ICEBERG_MINIO_SECRET_KEY is required}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      bpi-polaris-bootstrap:
        condition: service_completed_successfully
      bpi-iceberg-warehouse-bootstrap:
        condition: service_completed_successfully
    networks:
      - bpi-runtime

  bpi-polaris-catalog-bootstrap:
    image: ${BPI_DATASET_CATALOG_PUBLISHER_IMAGE:-ft-mes-bpi-dataset-catalog-publisher:local}
    profiles: ["bpi-catalog"]
    build:
      context: ../..
      dockerfile: services/bpi-dataset-catalog-publisher/Dockerfile
      args:
        PYTHON_IMAGE: ${BPI_DATASET_CATALOG_PUBLISHER_PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.12.13-slim-bookworm}
    user: "0:0"
    restart: "no"
    environment:
      BPI_POLARIS_ENABLED: ${BPI_POLARIS_ENABLED:-false}
      BPI_POLARIS_CATALOG_BOOTSTRAP_ENABLED: ${BPI_POLARIS_CATALOG_BOOTSTRAP_ENABLED:-false}
      BPI_POLARIS_BASE_URL: http://bpi-polaris:8181
      BPI_POLARIS_REALM: ${BPI_POLARIS_REALM:-POLARIS}
      BPI_POLARIS_BOOTSTRAP_CLIENT_ID: ${BPI_POLARIS_BOOTSTRAP_CLIENT_ID:?BPI_POLARIS_BOOTSTRAP_CLIENT_ID is required}
      BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET: ${BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET:?BPI_POLARIS_BOOTSTRAP_CLIENT_SECRET is required}
      BPI_POLARIS_PUBLISHER_CREDENTIAL_FILE: /var/run/bpi-polaris-credentials/publisher-credential
      BPI_POLARIS_PUBLISHER_CREDENTIAL_ROTATION_ENABLED: ${BPI_POLARIS_PUBLISHER_CREDENTIAL_ROTATION_ENABLED:-false}
      BPI_POLARIS_RECOVERY_CREDENTIAL_FILE: /var/run/bpi-polaris-credentials/recovery-credential
      BPI_POLARIS_RECOVERY_CREDENTIAL_ROTATION_ENABLED: ${BPI_POLARIS_RECOVERY_CREDENTIAL_ROTATION_ENABLED:-false}
      BPI_POLARIS_RECOVERY_CREDENTIAL_UID: "10004"
      BPI_POLARIS_RECOVERY_CREDENTIAL_GID: "10004"
      BPI_ICEBERG_WAREHOUSE_BUCKET: ${BPI_ICEBERG_WAREHOUSE_BUCKET:-bpi-iceberg-warehouse}
      BPI_ICEBERG_S3_ENDPOINT_EXTERNAL: ${BPI_ICEBERG_S3_ENDPOINT_EXTERNAL:-http://bpi-minio:9000}
      BPI_ICEBERG_S3_ENDPOINT_INTERNAL: http://bpi-minio:9000
    volumes:
      - ../polaris/bootstrap_bpi_catalog.py:/work/bootstrap_bpi_catalog.py:ro
      - bpi-polaris-publisher-credentials:/var/run/bpi-polaris-credentials
    entrypoint: ["python", "/work/bootstrap_bpi_catalog.py"]
    depends_on:
      bpi-polaris:
        condition: service_healthy
    networks:
      - bpi-runtime

  bpi-dataset-catalog-publisher:
    image: ${BPI_DATASET_CATALOG_PUBLISHER_IMAGE:-ft-mes-bpi-dataset-catalog-publisher:local}
    profiles: ["bpi-catalog"]
    build:
      context: ../..
      dockerfile: services/bpi-dataset-catalog-publisher/Dockerfile
      args:
        PYTHON_IMAGE: ${BPI_DATASET_CATALOG_PUBLISHER_PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.12.13-slim-bookworm}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BPI_DATASET_CATALOG_PUBLISHER_ENABLED: ${BPI_DATASET_CATALOG_PUBLISHER_ENABLED:-false}
      PGHOST: bpi-postgres
      PGPORT: "5432"
      PGDATABASE: ${BPI_DATABASE_NAME:-ft_mes_bpi}
      PGUSER: bpi_catalog_publisher
      PGPASSWORD: ${BPI_CATALOG_PUBLISHER_DATABASE_PASSWORD:?BPI_CATALOG_PUBLISHER_DATABASE_PASSWORD is required}
      PGSSLMODE: disable
      BPI_DATASET_CATALOG_SOURCE_MINIO_ENDPOINT: bpi-minio:9000
      BPI_DATASET_CATALOG_SOURCE_MINIO_SECURE: "false"
      BPI_DATASET_CATALOG_SOURCE_MINIO_ACCESS_KEY: ${BPI_DATASET_SOURCE_READER_ACCESS_KEY:?BPI_DATASET_SOURCE_READER_ACCESS_KEY is required}
      BPI_DATASET_CATALOG_SOURCE_MINIO_SECRET_KEY: ${BPI_DATASET_SOURCE_READER_SECRET_KEY:?BPI_DATASET_SOURCE_READER_SECRET_KEY is required}
      BPI_ICEBERG_CATALOG_URI: http://bpi-polaris:8181/api/catalog
      BPI_ICEBERG_CATALOG_WAREHOUSE: ft_mes_bpi
      BPI_ICEBERG_CATALOG_CREDENTIAL_FILE: /var/run/bpi-polaris-credentials/publisher-credential
      BPI_ICEBERG_CATALOG_OAUTH2_SERVER_URI: http://bpi-polaris:8181/api/catalog/v1/oauth/tokens
      BPI_ICEBERG_CATALOG_REALM: ${BPI_POLARIS_REALM:-POLARIS}
      BPI_ICEBERG_S3_ENDPOINT: http://bpi-minio:9000
      BPI_ICEBERG_S3_REGION: ${BPI_ICEBERG_S3_REGION:-us-east-1}
      BPI_DATASET_CATALOG_PUBLISHER_POLL_SECONDS: ${BPI_DATASET_CATALOG_PUBLISHER_POLL_SECONDS:-2}
      BPI_DATASET_CATALOG_PUBLISHER_CLAIM_TIMEOUT_SECONDS: ${BPI_DATASET_CATALOG_PUBLISHER_CLAIM_TIMEOUT_SECONDS:-300}
      BPI_DATASET_CATALOG_PUBLISHER_MAX_ATTEMPTS: ${BPI_DATASET_CATALOG_PUBLISHER_MAX_ATTEMPTS:-3}
    volumes:
      - bpi-catalog-publisher-work:/var/lib/bpi-catalog-publisher
      - bpi-polaris-publisher-credentials:/var/run/bpi-polaris-credentials:ro
    depends_on:
      bpi-migrate:
        condition: service_completed_successfully
      bpi-dataset-minio-bootstrap:
        condition: service_completed_successfully
      bpi-polaris-catalog-bootstrap:
        condition: service_completed_successfully
    networks:
      - bpi-runtime

  bpi-dataset-retention-archiver:
    image: ${BPI_DATASET_RETENTION_ARCHIVER_IMAGE:-ft-mes-bpi-dataset-retention-archiver:local}
    profiles: ["bpi-catalog"]
    build:
      context: ../..
      dockerfile: services/bpi-dataset-retention-archiver/Dockerfile
      args:
        PYTHON_IMAGE: ${BPI_DATASET_RETENTION_ARCHIVER_PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.12.13-slim-bookworm}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BPI_DATASET_RETENTION_ARCHIVER_ENABLED: ${BPI_DATASET_RETENTION_ARCHIVER_ENABLED:-false}
      PGHOST: bpi-postgres
      PGPORT: "5432"
      PGDATABASE: ${BPI_DATABASE_NAME:-ft_mes_bpi}
      PGUSER: bpi_retention_archiver
      PGPASSWORD: ${BPI_RETENTION_ARCHIVER_DATABASE_PASSWORD:?BPI_RETENTION_ARCHIVER_DATABASE_PASSWORD is required}
      PGSSLMODE: disable
      BPI_DATASET_RETENTION_MINIO_ENDPOINT: bpi-minio:9000
      BPI_DATASET_RETENTION_MINIO_SECURE: "false"
      BPI_DATASET_RETENTION_MINIO_ACCESS_KEY: ${BPI_DATASET_RETENTION_MINIO_ACCESS_KEY:?BPI_DATASET_RETENTION_MINIO_ACCESS_KEY is required}
      BPI_DATASET_RETENTION_MINIO_SECRET_KEY: ${BPI_DATASET_RETENTION_MINIO_SECRET_KEY:?BPI_DATASET_RETENTION_MINIO_SECRET_KEY is required}
      BPI_DATASET_RECOVERY_BUCKET: ${BPI_DATASET_RECOVERY_BUCKET:-bpi-dataset-recovery}
      BPI_DATASET_RETENTION_MODE: ${BPI_DATASET_RETENTION_MODE:-GOVERNANCE}
      BPI_DATASET_RETENTION_DAYS: ${BPI_DATASET_RETENTION_DAYS:-30}
      BPI_DATASET_RETENTION_LEGAL_HOLD: ${BPI_DATASET_RETENTION_LEGAL_HOLD:-false}
      BPI_DATASET_RETENTION_ARCHIVER_POLL_SECONDS: ${BPI_DATASET_RETENTION_ARCHIVER_POLL_SECONDS:-2}
      BPI_DATASET_RETENTION_ARCHIVER_CLAIM_TIMEOUT_SECONDS: ${BPI_DATASET_RETENTION_ARCHIVER_CLAIM_TIMEOUT_SECONDS:-300}
      BPI_DATASET_RETENTION_ARCHIVER_MAX_ATTEMPTS: ${BPI_DATASET_RETENTION_ARCHIVER_MAX_ATTEMPTS:-3}
    volumes:
      - bpi-retention-archiver-work:/var/lib/bpi-retention-archiver
    depends_on:
      bpi-migrate:
        condition: service_completed_successfully
      bpi-dataset-recovery-bootstrap:
        condition: service_completed_successfully
    networks:
      - bpi-runtime

  bpi-mlflow-artifact-bootstrap:
    image: ${MINIO_MC_IMAGE:-m.daocloud.io/docker.io/minio/mc:latest}
    profiles: ["bpi-ml"]
    restart: "no"
    environment:
      BPI_MLFLOW_ARTIFACT_BOOTSTRAP_ENABLED: ${BPI_MLFLOW_ARTIFACT_BOOTSTRAP_ENABLED:-false}
      BPI_MLFLOW_MINIO_ENDPOINT: http://bpi-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      BPI_MLFLOW_MINIO_ACCESS_KEY: ${BPI_MLFLOW_MINIO_ACCESS_KEY:?BPI_MLFLOW_MINIO_ACCESS_KEY is required}
