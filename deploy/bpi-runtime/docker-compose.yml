name: ${COMPOSE_PROJECT_NAME:-ft-mes-bpi-runtime}

services:
  bpi-postgres:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-bpi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BPI_DATABASE_NAME: ${BPI_DATABASE_NAME:-ft_mes_bpi}
      BPI_DATABASE_PASSWORD: ${BPI_DATABASE_PASSWORD:?BPI_DATABASE_PASSWORD is required}
      BPI_MIGRATOR_PASSWORD: ${BPI_MIGRATOR_PASSWORD:?BPI_MIGRATOR_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - bpi-postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init/176-bpi-database-role.sh:/docker-entrypoint-initdb.d/010-bpi-database-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpi_admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - bpi-runtime

  bpi-migrate:
    image: ${BPI_SERVICE_IMAGE:-ft-mes-bpi-service:local}
    build:
      context: ../..
      dockerfile: services/bpi-service/Dockerfile.runtime
      args:
        JAVA_IMAGE: ${BPI_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:17-jre-jammy}
    restart: "no"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BPI_DATABASE_URL: jdbc:postgresql://bpi-postgres:5432/${BPI_DATABASE_NAME:-ft_mes_bpi}
      BPI_DATABASE_USER: bpi_migrator
      BPI_DATABASE_PASSWORD: ${BPI_MIGRATOR_PASSWORD:?BPI_MIGRATOR_PASSWORD is required}
      BPI_FLYWAY_ENABLED: "true"
      BPI_INTERNAL_JWT_SECRET: ${BPI_INTERNAL_JWT_SECRET:?BPI_INTERNAL_JWT_SECRET is required}
      BPI_CANDIDATE_KAFKA_ENABLED: "false"
      BPI_POINT_CATALOG_KAFKA_ENABLED: "false"
      BPI_RULE_PUBLICATION_OUTBOX_ENABLED: "false"
      BPI_RULE_APPLICATION_KAFKA_ENABLED: "false"
    command:
      - --spring.main.web-application-type=none
      - --spring.main.banner-mode=off
    depends_on:
      bpi-postgres:
        condition: service_healthy
    networks:
      - bpi-runtime

  bpi-service:
    image: ${BPI_SERVICE_IMAGE:-ft-mes-bpi-service:local}
    build:
      context: ../..
      dockerfile: services/bpi-service/Dockerfile.runtime
      args:
        JAVA_IMAGE: ${BPI_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:17-jre-jammy}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BPI_SERVER_PORT: "19091"
      BPI_DATABASE_URL: jdbc:postgresql://bpi-postgres:5432/${BPI_DATABASE_NAME:-ft_mes_bpi}
      BPI_DATABASE_USER: bpi_service
      BPI_DATABASE_PASSWORD: ${BPI_DATABASE_PASSWORD:?BPI_DATABASE_PASSWORD is required}
      BPI_FLYWAY_ENABLED: "false"
      BPI_INTERNAL_JWT_SECRET: ${BPI_INTERNAL_JWT_SECRET:?BPI_INTERNAL_JWT_SECRET is required}
      BPI_INTERNAL_JWT_ISSUER: ${BPI_INTERNAL_JWT_ISSUER:-ft-mes-adapter}
      BPI_INTERNAL_JWT_AUDIENCE: ${BPI_INTERNAL_JWT_AUDIENCE:-bpi-service}
      BPI_INTERNAL_JWT_MAX_TTL: ${BPI_INTERNAL_JWT_MAX_TTL:-15m}
      BPI_TELEMETRY_HTTP_INGRESS_ENABLED: ${BPI_TELEMETRY_HTTP_INGRESS_ENABLED:-false}
      BPI_CANDIDATE_PROTOBUF_HTTP_INGRESS_ENABLED: ${BPI_CANDIDATE_PROTOBUF_HTTP_INGRESS_ENABLED:-false}
      BPI_CANDIDATE_KAFKA_ENABLED: ${BPI_CANDIDATE_KAFKA_ENABLED:-false}
      BPI_CANDIDATE_KAFKA_BOOTSTRAP_SERVERS: ${BPI_KAFKA_BOOTSTRAP_SERVERS:?BPI_KAFKA_BOOTSTRAP_SERVERS is required}
      BPI_CANDIDATE_KAFKA_TOPIC: ${BPI_CANDIDATE_KAFKA_TOPIC:-bpi.batch.candidate.v1}
      BPI_CANDIDATE_KAFKA_DLQ_TOPIC: ${BPI_CANDIDATE_KAFKA_DLQ_TOPIC:-bpi.batch.candidate.dlq.v1}
      BPI_CANDIDATE_KAFKA_GROUP_ID: ${BPI_CANDIDATE_KAFKA_GROUP_ID:-ft-mes-bpi-service-candidates-v1}
      BPI_CANDIDATE_KAFKA_CLIENT_ID: ${BPI_CANDIDATE_KAFKA_CLIENT_ID:-ft-mes-bpi-service}
      BPI_CANDIDATE_KAFKA_ACTOR_ID: ${BPI_CANDIDATE_KAFKA_ACTOR_ID:-bpi-stream-engine}
      BPI_CANDIDATE_KAFKA_ALLOWED_TENANT_IDS: ${BPI_CANDIDATE_KAFKA_ALLOWED_TENANT_IDS:-_DENY_ALL_}
      BPI_CANDIDATE_KAFKA_ALLOWED_PLANT_IDS: ${BPI_CANDIDATE_KAFKA_ALLOWED_PLANT_IDS:-_DENY_ALL_}
      BPI_CANDIDATE_KAFKA_ALLOWED_LINE_IDS: ${BPI_CANDIDATE_KAFKA_ALLOWED_LINE_IDS:-_DENY_ALL_}
      BPI_CANDIDATE_KAFKA_CONCURRENCY: ${BPI_CANDIDATE_KAFKA_CONCURRENCY:-3}
      BPI_POINT_CATALOG_KAFKA_ENABLED: ${BPI_POINT_CATALOG_KAFKA_ENABLED:-false}
      BPI_POINT_CATALOG_KAFKA_BOOTSTRAP_SERVERS: ${BPI_KAFKA_BOOTSTRAP_SERVERS:?BPI_KAFKA_BOOTSTRAP_SERVERS is required}
      BPI_POINT_CATALOG_KAFKA_TOPIC: ${BPI_POINT_CATALOG_KAFKA_TOPIC:-iot.point-catalog.snapshot.v1}
      BPI_POINT_CATALOG_KAFKA_DLQ_TOPIC: ${BPI_POINT_CATALOG_KAFKA_DLQ_TOPIC:-iot.point-catalog.snapshot.dlq.v1}
      BPI_POINT_CATALOG_KAFKA_GROUP_ID: ${BPI_POINT_CATALOG_KAFKA_GROUP_ID:-ft-mes-bpi-service-point-catalog-v1}
      BPI_POINT_CATALOG_KAFKA_CLIENT_ID: ${BPI_POINT_CATALOG_KAFKA_CLIENT_ID:-ft-mes-bpi-point-catalog}
      BPI_POINT_CATALOG_KAFKA_ACTOR_ID: ${BPI_POINT_CATALOG_KAFKA_ACTOR_ID:-jetlinks-point-catalog-sync}
      BPI_POINT_CATALOG_KAFKA_ALLOWED_TENANT_IDS: ${BPI_POINT_CATALOG_KAFKA_ALLOWED_TENANT_IDS:-_DENY_ALL_}
      BPI_POINT_CATALOG_KAFKA_ALLOWED_PLANT_IDS: ${BPI_POINT_CATALOG_KAFKA_ALLOWED_PLANT_IDS:-_DENY_ALL_}
      BPI_POINT_CATALOG_KAFKA_ALLOWED_LINE_IDS: ${BPI_POINT_CATALOG_KAFKA_ALLOWED_LINE_IDS:-_DENY_ALL_}
      BPI_POINT_CATALOG_KAFKA_CONCURRENCY: ${BPI_POINT_CATALOG_KAFKA_CONCURRENCY:-1}
      BPI_POINT_CATALOG_KAFKA_MAX_PAYLOAD_BYTES: ${BPI_POINT_CATALOG_KAFKA_MAX_PAYLOAD_BYTES:-5242880}
      BPI_RULE_PUBLICATION_OUTBOX_ENABLED: ${BPI_RULE_PUBLICATION_OUTBOX_ENABLED:-false}
      BPI_RULE_PUBLICATION_BOOTSTRAP_SERVERS: ${BPI_KAFKA_BOOTSTRAP_SERVERS:?BPI_KAFKA_BOOTSTRAP_SERVERS is required}
      BPI_RULE_PUBLICATION_TOPIC: ${BPI_RULE_PUBLICATION_TOPIC:-bpi.boundary.rule-publication.v1}
      BPI_RULE_APPLICATION_KAFKA_ENABLED: ${BPI_RULE_APPLICATION_KAFKA_ENABLED:-false}
      BPI_RULE_APPLICATION_KAFKA_BOOTSTRAP_SERVERS: ${BPI_KAFKA_BOOTSTRAP_SERVERS:?BPI_KAFKA_BOOTSTRAP_SERVERS is required}
      BPI_RULE_APPLICATION_KAFKA_TOPIC: ${BPI_RULE_APPLICATION_KAFKA_TOPIC:-bpi.boundary.rule-application.v1}
      BPI_RULE_APPLICATION_KAFKA_DLQ_TOPIC: ${BPI_RULE_APPLICATION_KAFKA_DLQ_TOPIC:-bpi.boundary.rule-application.dlq.v1}
      BPI_RULE_RUNTIME_READINESS_KAFKA_TOPIC: ${BPI_RULE_RUNTIME_READINESS_KAFKA_TOPIC:-bpi.boundary.rule-runtime-readiness.v1}
      BPI_RULE_RUNTIME_READINESS_KAFKA_DLQ_TOPIC: ${BPI_RULE_RUNTIME_READINESS_KAFKA_DLQ_TOPIC:-bpi.boundary.rule-runtime-readiness.dlq.v1}
      BPI_RULE_APPLICATION_KAFKA_GROUP_ID: ${BPI_RULE_APPLICATION_KAFKA_GROUP_ID:-ft-mes-bpi-service-rule-applications-v1}
      BPI_RULE_APPLICATION_KAFKA_CLIENT_ID: ${BPI_RULE_APPLICATION_KAFKA_CLIENT_ID:-ft-mes-bpi-rule-application}
      BPI_RULE_APPLICATION_KAFKA_ALLOWED_TENANT_IDS: ${BPI_RULE_APPLICATION_KAFKA_ALLOWED_TENANT_IDS:-_DENY_ALL_}
      BPI_RULE_APPLICATION_KAFKA_ALLOWED_PLANT_IDS: ${BPI_RULE_APPLICATION_KAFKA_ALLOWED_PLANT_IDS:-_DENY_ALL_}
      BPI_RULE_APPLICATION_KAFKA_ALLOWED_LINE_IDS: ${BPI_RULE_APPLICATION_KAFKA_ALLOWED_LINE_IDS:-_DENY_ALL_}
      BPI_RULE_APPLICATION_KAFKA_CONCURRENCY: ${BPI_RULE_APPLICATION_KAFKA_CONCURRENCY:-3}
    ports:
      - "${BPI_BIND_ADDRESS:-127.0.0.1}:${BPI_HTTP_PORT:-19091}:19091"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/19091'"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      bpi-migrate:
        condition: service_completed_successfully
    networks:
      - bpi-runtime

  bpi-adapter:
    image: ${BPI_ADAPTER_IMAGE:-ft-mes-bpi-adapter:local}
    build:
      context: ../..
      dockerfile: backend/source-modules/batch-intelligence-adapter/Dockerfile.runtime
      args:
        JAVA_IMAGE: ${BPI_ADAPTER_JAVA_IMAGE:-m.daocloud.io/docker.io/eclipse-temurin:8-jre}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BPI_ADAPTER_SERVER_PORT: "19080"
      BPI_ADAPTER_UPSTREAM_BASE_URL: http://bpi-service:19091
      BPI_ADAPTER_KEYCLOAK_JWK_SET_URI: ${BPI_ADAPTER_KEYCLOAK_JWK_SET_URI:?BPI_ADAPTER_KEYCLOAK_JWK_SET_URI is required}
      BPI_ADAPTER_KEYCLOAK_ISSUER: ${BPI_ADAPTER_KEYCLOAK_ISSUER:?BPI_ADAPTER_KEYCLOAK_ISSUER is required}
      BPI_ADAPTER_KEYCLOAK_AUDIENCE: ${BPI_ADAPTER_KEYCLOAK_AUDIENCE:-pc_dt}
      BPI_ADAPTER_LEGACY_TICKET_ENABLED: ${BPI_ADAPTER_LEGACY_TICKET_ENABLED:-true}
      BPI_ADAPTER_LEGACY_GATEWAY_BASE_URL: ${BPI_ADAPTER_LEGACY_GATEWAY_BASE_URL:?BPI_ADAPTER_LEGACY_GATEWAY_BASE_URL is required}
      BPI_ADAPTER_TENANT_CLAIM: ${BPI_ADAPTER_TENANT_CLAIM:-companyId}
      BPI_ADAPTER_USERNAME_CLAIM: ${BPI_ADAPTER_USERNAME_CLAIM:-userName}
      BPI_ADAPTER_INTERNAL_JWT_SECRET: ${BPI_INTERNAL_JWT_SECRET:?BPI_INTERNAL_JWT_SECRET is required}
      BPI_ADAPTER_INTERNAL_JWT_ISSUER: ${BPI_INTERNAL_JWT_ISSUER:-ft-mes-adapter}
      BPI_ADAPTER_INTERNAL_JWT_AUDIENCE: ${BPI_INTERNAL_JWT_AUDIENCE:-bpi-service}
      BPI_ADAPTER_INTERNAL_TOKEN_TTL: ${BPI_ADAPTER_INTERNAL_TOKEN_TTL:-10m}
      BPI_ADAPTER_ROLE_RULES: ${BPI_ADAPTER_ROLE_RULES:?BPI_ADAPTER_ROLE_RULES is required}
      BPI_ADAPTER_SUBJECT_SCOPE_RULES: ${BPI_ADAPTER_SUBJECT_SCOPE_RULES:?BPI_ADAPTER_SUBJECT_SCOPE_RULES is required}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/19080'"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      bpi-service:
        condition: service_healthy
    networks:
      - bpi-runtime
      - adp-runtime

  bpi-web:
    image: ${BPI_NGINX_IMAGE:-m.daocloud.io/docker.io/library/nginx:1.24.0}
    restart: unless-stopped
    ports:
      - "${BPI_WEB_BIND_ADDRESS:-127.0.0.1}:${BPI_WEB_PORT:-18090}:8080"
    volumes:
      - ../../frontend/apps/bpi/dist:/usr/share/nginx/html:ro
      - ./nginx/bpi.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      bpi-adapter:
        condition: service_healthy
    networks:
      - bpi-runtime

networks:
  bpi-runtime:
    driver: bridge
  adp-runtime:
    external: true
    name: ${ADP_RUNTIME_NETWORK_NAME:?ADP_RUNTIME_NETWORK_NAME is required}

volumes:
  bpi-postgres-data:
