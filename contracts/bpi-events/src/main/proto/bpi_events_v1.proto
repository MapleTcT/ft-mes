syntax = "proto3";

package ftmes.bpi.contract.v1;

option java_multiple_files = true;
option java_package = "com.mapletct.ftmes.bpi.contract.v1";
option java_outer_classname = "BpiEventsV1Proto";

// The envelope is the immutable transport unit from JetLinks to the BPI stream pipeline.
message TelemetryEnvelopeV1 {
  string event_id = 1;
  string message_id = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  string gateway_id = 6;
  string product_id = 7;
  string device_id = 8;
  int64 event_time_ms = 9;
  int64 ingest_time_ms = 10;
  uint64 sequence = 11;
  repeated PointValue points = 12;
  map<string, string> headers = 13;
  uint64 source_epoch = 14;
  SequenceOrigin sequence_origin = 15;
}

message PointValue {
  string property_id = 1;
  oneof value {
    double double_value = 2;
    int64 long_value = 3;
    string string_value = 4;
    bool bool_value = 5;
  }
  string unit = 6;
  string quality_code = 7;
  int64 sample_time_ms = 8;
  string calibration_version = 9;
}

enum SequenceOrigin {
  SEQUENCE_ORIGIN_UNSPECIFIED = 0;
  DEVICE = 1;
  GATEWAY = 2;
  EXPORTER = 3;
}

// Low-frequency control-plane snapshot emitted by JetLinks after resolving the
// configured MES bindings against the authoritative device registry and metadata.
// A source_revision identifies immutable catalog content; observed_at_ms is not
// part of that revision and only records when the source was inspected.
message PointCatalogSnapshotV1 {
  string event_id = 1;
  string source = 2;
  string source_instance = 3;
  // SHA-256 of the deterministic protobuf containing source, source_instance,
  // tenant_id, plant_id, line_id and the canonically sorted points only.
  string source_revision = 4;
  string tenant_id = 5;
  string plant_id = 6;
  string line_id = 7;
  int64 observed_at_ms = 8;
  repeated PointCatalogPointV1 points = 9;
  string reason = 10;
}

message PointCatalogPointV1 {
  string locality_group = 1;
  string product_id = 2;
  string device_id = 3;
  string property_id = 4;
  string source_property_id = 5;
  string point_name = 6;
  string unit = 7;
  string data_type = 8;
  PointDeviceStateV1 device_state = 9;
  bool registered = 10;
  bool property_present = 11;
  string calibration_version = 12;
  PointCalibrationStatusV1 calibration_status = 13;
  bool source_sequence_enabled = 14;
  bool source_sequence_required = 15;
  SequenceOrigin source_sequence_origin = 16;
  string source_sequence_binding_fingerprint = 17;
}

// Device-level control-plane evidence. The Kafka topic is compacted by the
// stable binding identity so volatile sequence ranges are not duplicated into
// every point-catalog row.
message SourceSequenceEvidenceV1 {
  string event_id = 1;
  string source = 2;
  string source_instance = 3;
  string tenant_id = 4;
  string plant_id = 5;
  string line_id = 6;
  string product_id = 7;
  string device_id = 8;
  string binding_fingerprint = 9;
  SourceSequenceEvidenceStatusV1 status = 10;
  SequenceOrigin sequence_origin = 11;
  uint64 source_epoch = 12;
  uint64 first_sequence = 13;
  uint64 last_sequence = 14;
  uint32 observation_count = 15;
  int64 first_observed_at_ms = 16;
  int64 last_observed_at_ms = 17;
  int64 valid_until_ms = 18;
  int64 observed_at_ms = 19;
  string reason = 20;
}

enum PointDeviceStateV1 {
  POINT_DEVICE_STATE_UNSPECIFIED = 0;
  POINT_DEVICE_ACTIVE = 1;
  POINT_DEVICE_INACTIVE = 2;
  POINT_DEVICE_UNKNOWN = 3;
}

enum PointCalibrationStatusV1 {
  POINT_CALIBRATION_STATUS_UNSPECIFIED = 0;
  POINT_CALIBRATION_VERIFIED = 1;
  POINT_CALIBRATION_UNVERIFIED = 2;
  POINT_CALIBRATION_MISSING = 3;
}

enum SourceSequenceEvidenceStatusV1 {
  SOURCE_SEQUENCE_EVIDENCE_STATUS_UNSPECIFIED = 0;
  SOURCE_SEQUENCE_EVIDENCE_DISABLED = 1;
  SOURCE_SEQUENCE_EVIDENCE_MISSING = 2;
  SOURCE_SEQUENCE_EVIDENCE_PENDING = 3;
  SOURCE_SEQUENCE_EVIDENCE_QUALIFIED = 4;
  SOURCE_SEQUENCE_EVIDENCE_EXPIRED = 5;
}

// Production context is emitted from the MES outbox and joined to telemetry by event time.
message ProductionContextEventV1 {
  string event_id = 1;
  string tenant_id = 2;
  string plant_id = 3;
  string line_id = 4;
  string order_id = 5;
  string task_id = 6;
  string material_code = 7;
  string recipe_version = 8;
  int64 effective_from_ms = 9;
  int64 effective_to_ms = 10;
  uint64 context_revision = 11;
  bool active = 12;
  map<string, string> attributes = 13;
  string batch_id = 14;
}

enum BoundaryType {
  BOUNDARY_TYPE_UNSPECIFIED = 0;
  START = 1;
  END = 2;
}

// Candidate events are observations only in Phase 1. They cannot mutate WOM, QCS or WMS.
message BatchCandidateV1 {
  string event_id = 1;
  string candidate_key = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  BoundaryType boundary_type = 6;
  string rule_code = 7;
  string rule_version = 8;
  string topology_version = 9;
  string context_order_id = 10;
  string batch_id = 11;
  string first_quorum_evidence_event_id = 12;
  int64 boundary_event_time_ms = 13;
  double confidence = 14;
  repeated string evidence_event_ids = 15;
  int64 emitted_at_ms = 16;
  map<string, string> headers = 17;
  repeated CandidateEvidenceV1 evidence = 18;
  repeated string missing_signals = 19;
}

message CandidateEvidenceV1 {
  string event_id = 1;
  string signal = 2;
  string classification = 3;
  bool satisfied = 4;
  string value = 5;
  string unit = 6;
  string quality_code = 7;
  int64 event_time_ms = 8;
  string source = 9;
}

enum DataQualitySeverity {
  DATA_QUALITY_SEVERITY_UNSPECIFIED = 0;
  INFO = 1;
  WARNING = 2;
  ERROR = 3;
  CRITICAL = 4;
}

message DataQualityEventV1 {
  string event_id = 1;
  string source_event_id = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  string device_id = 6;
  string property_id = 7;
  string issue_code = 8;
  DataQualitySeverity severity = 9;
  string detail = 10;
  int64 detected_at_ms = 11;
  map<string, string> headers = 12;
}

// Immutable control-plane event emitted after a rule version, topology version and
// signal bindings pass simulation and approval. Existing versions cannot be overwritten.
message BoundaryRulePublicationV1 {
  string event_id = 1;
  string tenant_id = 2;
  string plant_id = 3;
  string line_id = 4;
  string locality_group = 5;
  string topology_code = 6;
  string topology_version = 7;
  string rule_code = 8;
  string rule_version = 9;
  BoundaryType boundary_type = 10;
  int32 quorum_minimum = 11;
  double minimum_confidence = 12;
  double max_composite_penalty = 13;
  int64 allowed_lateness_ms = 14;
  int64 watermark_delay_ms = 15;
  int64 evaluation_timeout_ms = 16;
  repeated BoundaryEvidenceConditionV1 conditions = 17;
  repeated BoundarySignalBindingV1 signal_bindings = 18;
  bool active = 19;
  int64 published_at_ms = 20;
  string checksum = 21;
  map<string, string> headers = 22;
}

message BoundaryEvidenceConditionV1 {
  string signal = 1;
  BoundaryConditionOperatorV1 operator = 2;
  string threshold_decimal = 3;
  int64 hold_for_ms = 4;
  int64 max_silence_ms = 5;
  BoundaryEvidenceClassV1 classification = 6;
  int32 weight = 7;
}

message BoundarySignalBindingV1 {
  string device_id = 1;
  string property_id = 2;
  string signal = 3;
  string expected_unit = 4;
  // Product identity is part of the reviewed point-catalog key. Device/property
  // alone is not sufficient when the same device id can exist in multiple products.
  string product_id = 5;
  // Immutable calibration version approved with the topology. Runtime telemetry
  // and the latest point catalog must both match this value.
  string calibration_version = 6;
}

enum BoundaryConditionOperatorV1 {
  BOUNDARY_CONDITION_OPERATOR_UNSPECIFIED = 0;
  GREATER_THAN = 1;
  LESS_THAN = 2;
  EQUALS_TRUE = 3;
  EQUALS_FALSE = 4;
  RISING = 5;
}

enum BoundaryEvidenceClassV1 {
  BOUNDARY_EVIDENCE_CLASS_UNSPECIFIED = 0;
  REQUIRED = 1;
  QUORUM = 2;
  OPTIONAL = 3;
}

// Flink emits this control-plane receipt through an exactly-once sink. APPLIED is
// visible only after the checkpoint containing the rule broadcast state commits.
message BoundaryRuleApplicationV1 {
  string event_id = 1;
  string publication_event_id = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  string rule_code = 6;
  string rule_version = 7;
  string checksum = 8;
  string deployment_id = 9;
  BoundaryRuleApplicationStatusV1 status = 10;
  string error_code = 11;
  string detail = 12;
  int64 observed_at_ms = 13;
  map<string, string> headers = 14;
}

enum BoundaryRuleApplicationStatusV1 {
  BOUNDARY_RULE_APPLICATION_STATUS_UNSPECIFIED = 0;
  APPLIED = 1;
  REJECTED = 2;
}

// Runtime point-catalog admission is independent from rule lifecycle application.
// Flink emits a new receipt whenever the exact status or controlled reason changes.
message BoundaryRuleRuntimeReadinessV1 {
  string event_id = 1;
  string publication_event_id = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  string rule_code = 6;
  string rule_version = 7;
  string checksum = 8;
  string deployment_id = 9;
  BoundaryRuleRuntimeReadinessStatusV1 status = 10;
  string reason_code = 11;
  string detail = 12;
  int64 observed_at_ms = 13;
  string point_catalog_event_id = 14;
  string point_catalog_source_revision = 15;
  map<string, string> headers = 16;
}

enum BoundaryRuleRuntimeReadinessStatusV1 {
  BOUNDARY_RULE_RUNTIME_READINESS_STATUS_UNSPECIFIED = 0;
  READY = 1;
  DEGRADED = 2;
  INACTIVE = 3;
}
