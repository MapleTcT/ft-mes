syntax = "proto3";

package ftmes.bpi.contract.v1;

option java_multiple_files = true;
option java_package = "com.mapletct.ftmes.bpi.contract.v1";
option java_outer_classname = "BpiEventsV1Proto";

// The envelope is the immutable transport unit from JetLinks to the BPI stream pipeline.
message TelemetryEnvelopeV1 {
  string event_id = 1;
  string message_id = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  string gateway_id = 6;
  string product_id = 7;
  string device_id = 8;
  int64 event_time_ms = 9;
  int64 ingest_time_ms = 10;
  uint64 sequence = 11;
  repeated PointValue points = 12;
  map<string, string> headers = 13;
  uint64 source_epoch = 14;
  SequenceOrigin sequence_origin = 15;
}

message PointValue {
  string property_id = 1;
  oneof value {
    double double_value = 2;
    int64 long_value = 3;
    string string_value = 4;
    bool bool_value = 5;
  }
  string unit = 6;
  string quality_code = 7;
  int64 sample_time_ms = 8;
  string calibration_version = 9;
}

enum SequenceOrigin {
  SEQUENCE_ORIGIN_UNSPECIFIED = 0;
  DEVICE = 1;
  GATEWAY = 2;
  EXPORTER = 3;
}

// Production context is emitted from the MES outbox and joined to telemetry by event time.
message ProductionContextEventV1 {
  string event_id = 1;
  string tenant_id = 2;
  string plant_id = 3;
  string line_id = 4;
  string order_id = 5;
  string task_id = 6;
  string material_code = 7;
  string recipe_version = 8;
  int64 effective_from_ms = 9;
  int64 effective_to_ms = 10;
  uint64 context_revision = 11;
  bool active = 12;
  map<string, string> attributes = 13;
}

enum BoundaryType {
  BOUNDARY_TYPE_UNSPECIFIED = 0;
  START = 1;
  END = 2;
}

// Candidate events are observations only in Phase 1. They cannot mutate WOM, QCS or WMS.
message BatchCandidateV1 {
  string event_id = 1;
  string candidate_key = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  BoundaryType boundary_type = 6;
  string rule_code = 7;
  string rule_version = 8;
  string topology_version = 9;
  string context_order_id = 10;
  string batch_id = 11;
  string first_quorum_evidence_event_id = 12;
  int64 boundary_event_time_ms = 13;
  double confidence = 14;
  repeated string evidence_event_ids = 15;
  int64 emitted_at_ms = 16;
  map<string, string> headers = 17;
  repeated CandidateEvidenceV1 evidence = 18;
  repeated string missing_signals = 19;
}

message CandidateEvidenceV1 {
  string event_id = 1;
  string signal = 2;
  string classification = 3;
  bool satisfied = 4;
  string value = 5;
  string unit = 6;
  string quality_code = 7;
  int64 event_time_ms = 8;
  string source = 9;
}

enum DataQualitySeverity {
  DATA_QUALITY_SEVERITY_UNSPECIFIED = 0;
  INFO = 1;
  WARNING = 2;
  ERROR = 3;
  CRITICAL = 4;
}

message DataQualityEventV1 {
  string event_id = 1;
  string source_event_id = 2;
  string tenant_id = 3;
  string plant_id = 4;
  string line_id = 5;
  string device_id = 6;
  string property_id = 7;
  string issue_code = 8;
  DataQualitySeverity severity = 9;
  string detail = 10;
  int64 detected_at_ms = 11;
  map<string, string> headers = 12;
}
