[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-mes-bpi-dataset-catalog-publisher"
version = "0.1.0"
description = "Verified Apache Iceberg catalog publisher for FT MES BPI datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "minio==7.2.20",
  "psycopg[binary]==3.3.4",
  "pyarrow==25.0.0",
  "pyiceberg[pyarrow]==0.11.1",
  "requests==2.32.5",
]

[project.scripts]
bpi-dataset-catalog-publisher = "bpi_dataset_catalog_publisher.worker:main"
bpi-dataset-recovery-rehearsal = "bpi_dataset_catalog_publisher.recovery_rehearsal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpi_dataset_catalog_publisher = ["py.typed"]
