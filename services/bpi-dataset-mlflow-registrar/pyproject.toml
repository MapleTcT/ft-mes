[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-mes-bpi-dataset-mlflow-registrar"
version = "0.1.0"
description = "Registers immutable FT MES BPI datasets as verified MLflow inputs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.3.4",
]

[project.scripts]
bpi-dataset-mlflow-registrar = "bpi_dataset_mlflow_registrar.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpi_dataset_mlflow_registrar = ["py.typed"]
