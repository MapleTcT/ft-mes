server:
  port: ${BPI_SERVER_PORT:19091}
  shutdown: graceful

spring:
  application:
    name: bpi-service
  datasource:
    url: ${BPI_DATABASE_URL:jdbc:postgresql://localhost:5432/ft_mes_bpi}
    username: ${BPI_DATABASE_USER:bpi_service}
    password: ${BPI_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${BPI_DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: ${BPI_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: bpi
    default-schema: bpi
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

bpi:
  security:
    internal-jwt-secret: ${BPI_INTERNAL_JWT_SECRET:}
    issuer: ${BPI_INTERNAL_JWT_ISSUER:ft-mes-adapter}
    audience: ${BPI_INTERNAL_JWT_AUDIENCE:bpi-service}
    max-token-ttl: ${BPI_INTERNAL_JWT_MAX_TTL:15m}
