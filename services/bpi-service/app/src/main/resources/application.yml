server:
  port: ${BPI_SERVER_PORT:19091}
  shutdown: graceful

spring:
  application:
    name: bpi-service
  datasource:
    url: ${BPI_DATABASE_URL:jdbc:postgresql://localhost:5432/ft_mes_bpi}
    username: ${BPI_DATABASE_USER:bpi_service}
    password: ${BPI_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${BPI_DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: ${BPI_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: bpi
    default-schema: bpi
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

bpi:
  candidate-event:
    protobuf-http-ingress-enabled: ${BPI_CANDIDATE_PROTOBUF_HTTP_INGRESS_ENABLED:false}
    max-payload-bytes: ${BPI_CANDIDATE_EVENT_MAX_PAYLOAD_BYTES:1048576}
  candidate-kafka:
    enabled: ${BPI_CANDIDATE_KAFKA_ENABLED:false}
    bootstrap-servers: ${BPI_CANDIDATE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    topic: ${BPI_CANDIDATE_KAFKA_TOPIC:bpi.batch.candidate.v1}
    dlq-topic: ${BPI_CANDIDATE_KAFKA_DLQ_TOPIC:bpi.batch.candidate.dlq.v1}
    group-id: ${BPI_CANDIDATE_KAFKA_GROUP_ID:ft-mes-bpi-service-candidates-v1}
    client-id: ${BPI_CANDIDATE_KAFKA_CLIENT_ID:ft-mes-bpi-service}
    actor-id: ${BPI_CANDIDATE_KAFKA_ACTOR_ID:bpi-stream-engine}
    allowed-tenant-ids: ${BPI_CANDIDATE_KAFKA_ALLOWED_TENANT_IDS:_DENY_ALL_}
    allowed-plant-ids: ${BPI_CANDIDATE_KAFKA_ALLOWED_PLANT_IDS:_DENY_ALL_}
    allowed-line-ids: ${BPI_CANDIDATE_KAFKA_ALLOWED_LINE_IDS:_DENY_ALL_}
    concurrency: ${BPI_CANDIDATE_KAFKA_CONCURRENCY:3}
    max-attempts: ${BPI_CANDIDATE_KAFKA_MAX_ATTEMPTS:4}
    retry-backoff: ${BPI_CANDIDATE_KAFKA_RETRY_BACKOFF:2s}
  data-quality-kafka:
    enabled: ${BPI_DATA_QUALITY_KAFKA_ENABLED:false}
    bootstrap-servers: ${BPI_DATA_QUALITY_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    topic: ${BPI_DATA_QUALITY_KAFKA_TOPIC:bpi.data-quality.v1}
    dlq-topic: ${BPI_DATA_QUALITY_KAFKA_DLQ_TOPIC:bpi.data-quality.dlq.v1}
    group-id: ${BPI_DATA_QUALITY_KAFKA_GROUP_ID:ft-mes-bpi-service-data-quality-v1}
    client-id: ${BPI_DATA_QUALITY_KAFKA_CLIENT_ID:ft-mes-bpi-data-quality}
    actor-id: ${BPI_DATA_QUALITY_KAFKA_ACTOR_ID:bpi-stream-engine}
    allowed-tenant-ids: ${BPI_DATA_QUALITY_KAFKA_ALLOWED_TENANT_IDS:_DENY_ALL_}
    allowed-plant-ids: ${BPI_DATA_QUALITY_KAFKA_ALLOWED_PLANT_IDS:_DENY_ALL_}
    allowed-line-ids: ${BPI_DATA_QUALITY_KAFKA_ALLOWED_LINE_IDS:_DENY_ALL_}
    concurrency: ${BPI_DATA_QUALITY_KAFKA_CONCURRENCY:3}
    max-attempts: ${BPI_DATA_QUALITY_KAFKA_MAX_ATTEMPTS:4}
    retry-backoff: ${BPI_DATA_QUALITY_KAFKA_RETRY_BACKOFF:2s}
    max-payload-bytes: ${BPI_DATA_QUALITY_KAFKA_MAX_PAYLOAD_BYTES:65536}
  point-catalog-kafka:
    enabled: ${BPI_POINT_CATALOG_KAFKA_ENABLED:false}
    bootstrap-servers: ${BPI_POINT_CATALOG_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    topic: ${BPI_POINT_CATALOG_KAFKA_TOPIC:iot.point-catalog.snapshot.v1}
    dlq-topic: ${BPI_POINT_CATALOG_KAFKA_DLQ_TOPIC:iot.point-catalog.snapshot.dlq.v1}
    group-id: ${BPI_POINT_CATALOG_KAFKA_GROUP_ID:ft-mes-bpi-service-point-catalog-v1}
    client-id: ${BPI_POINT_CATALOG_KAFKA_CLIENT_ID:ft-mes-bpi-point-catalog}
    actor-id: ${BPI_POINT_CATALOG_KAFKA_ACTOR_ID:jetlinks-point-catalog-sync}
    allowed-tenant-ids: ${BPI_POINT_CATALOG_KAFKA_ALLOWED_TENANT_IDS:_DENY_ALL_}
    allowed-plant-ids: ${BPI_POINT_CATALOG_KAFKA_ALLOWED_PLANT_IDS:_DENY_ALL_}
    allowed-line-ids: ${BPI_POINT_CATALOG_KAFKA_ALLOWED_LINE_IDS:_DENY_ALL_}
    concurrency: ${BPI_POINT_CATALOG_KAFKA_CONCURRENCY:1}
    max-attempts: ${BPI_POINT_CATALOG_KAFKA_MAX_ATTEMPTS:4}
    retry-backoff: ${BPI_POINT_CATALOG_KAFKA_RETRY_BACKOFF:2s}
    max-payload-bytes: ${BPI_POINT_CATALOG_KAFKA_MAX_PAYLOAD_BYTES:5242880}
  source-sequence-kafka:
    enabled: ${BPI_SOURCE_SEQUENCE_KAFKA_ENABLED:false}
    bootstrap-servers: ${BPI_SOURCE_SEQUENCE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    topic: ${BPI_SOURCE_SEQUENCE_KAFKA_TOPIC:iot.source-sequence.evidence.v1}
    dlq-topic: ${BPI_SOURCE_SEQUENCE_KAFKA_DLQ_TOPIC:iot.source-sequence.evidence.dlq.v1}
    group-id: ${BPI_SOURCE_SEQUENCE_KAFKA_GROUP_ID:ft-mes-bpi-service-source-sequence-v1}
    client-id: ${BPI_SOURCE_SEQUENCE_KAFKA_CLIENT_ID:ft-mes-bpi-source-sequence}
    actor-id: ${BPI_SOURCE_SEQUENCE_KAFKA_ACTOR_ID:jetlinks-source-sequence-sync}
    allowed-tenant-ids: ${BPI_SOURCE_SEQUENCE_KAFKA_ALLOWED_TENANT_IDS:_DENY_ALL_}
    allowed-plant-ids: ${BPI_SOURCE_SEQUENCE_KAFKA_ALLOWED_PLANT_IDS:_DENY_ALL_}
    allowed-line-ids: ${BPI_SOURCE_SEQUENCE_KAFKA_ALLOWED_LINE_IDS:_DENY_ALL_}
    concurrency: ${BPI_SOURCE_SEQUENCE_KAFKA_CONCURRENCY:1}
    max-attempts: ${BPI_SOURCE_SEQUENCE_KAFKA_MAX_ATTEMPTS:4}
    retry-backoff: ${BPI_SOURCE_SEQUENCE_KAFKA_RETRY_BACKOFF:2s}
    max-payload-bytes: ${BPI_SOURCE_SEQUENCE_KAFKA_MAX_PAYLOAD_BYTES:65536}
  rule-publication-outbox:
    enabled: ${BPI_RULE_PUBLICATION_OUTBOX_ENABLED:false}
    bootstrap-servers: ${BPI_RULE_PUBLICATION_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    topic: ${BPI_RULE_PUBLICATION_TOPIC:bpi.boundary.rule-publication.v1}
    client-id: ${BPI_RULE_PUBLICATION_CLIENT_ID:ft-mes-bpi-rule-outbox}
    batch-size: ${BPI_RULE_PUBLICATION_BATCH_SIZE:50}
    max-attempts: ${BPI_RULE_PUBLICATION_MAX_ATTEMPTS:20}
    poll-delay: ${BPI_RULE_PUBLICATION_POLL_DELAY:1s}
    claim-timeout: ${BPI_RULE_PUBLICATION_CLAIM_TIMEOUT:2m}
    retry-backoff: ${BPI_RULE_PUBLICATION_RETRY_BACKOFF:2s}
  rule-application-kafka:
    enabled: ${BPI_RULE_APPLICATION_KAFKA_ENABLED:false}
    bootstrap-servers: ${BPI_RULE_APPLICATION_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    topic: ${BPI_RULE_APPLICATION_KAFKA_TOPIC:bpi.boundary.rule-application.v1}
    dlq-topic: ${BPI_RULE_APPLICATION_KAFKA_DLQ_TOPIC:bpi.boundary.rule-application.dlq.v1}
    runtime-readiness-topic: ${BPI_RULE_RUNTIME_READINESS_KAFKA_TOPIC:bpi.boundary.rule-runtime-readiness.v1}
    runtime-readiness-dlq-topic: ${BPI_RULE_RUNTIME_READINESS_KAFKA_DLQ_TOPIC:bpi.boundary.rule-runtime-readiness.dlq.v1}
    group-id: ${BPI_RULE_APPLICATION_KAFKA_GROUP_ID:ft-mes-bpi-service-rule-applications-v1}
    client-id: ${BPI_RULE_APPLICATION_KAFKA_CLIENT_ID:ft-mes-bpi-rule-application}
    allowed-tenant-ids: ${BPI_RULE_APPLICATION_KAFKA_ALLOWED_TENANT_IDS:_DENY_ALL_}
    allowed-plant-ids: ${BPI_RULE_APPLICATION_KAFKA_ALLOWED_PLANT_IDS:_DENY_ALL_}
    allowed-line-ids: ${BPI_RULE_APPLICATION_KAFKA_ALLOWED_LINE_IDS:_DENY_ALL_}
    concurrency: ${BPI_RULE_APPLICATION_KAFKA_CONCURRENCY:3}
    max-attempts: ${BPI_RULE_APPLICATION_KAFKA_MAX_ATTEMPTS:4}
    retry-backoff: ${BPI_RULE_APPLICATION_KAFKA_RETRY_BACKOFF:2s}
    max-payload-bytes: ${BPI_RULE_APPLICATION_KAFKA_MAX_PAYLOAD_BYTES:65536}
  security:
    internal-jwt-secret: ${BPI_INTERNAL_JWT_SECRET:}
    issuer: ${BPI_INTERNAL_JWT_ISSUER:ft-mes-adapter}
    audience: ${BPI_INTERNAL_JWT_AUDIENCE:bpi-service}
    max-token-ttl: ${BPI_INTERNAL_JWT_MAX_TTL:15m}
  telemetry:
    http-ingress-enabled: ${BPI_TELEMETRY_HTTP_INGRESS_ENABLED:false}
    max-payload-bytes: ${BPI_TELEMETRY_MAX_PAYLOAD_BYTES:524288}
    max-points-per-envelope: ${BPI_TELEMETRY_MAX_POINTS:500}
    max-future-skew: ${BPI_TELEMETRY_MAX_FUTURE_SKEW:2m}
    accepted-units: ${BPI_TELEMETRY_ACCEPTED_UNITS:1,bool,%,t/h,kg/h,m3/h,m3/s,kg/s,degC,kPa,MPa,Be,Baume,Brix}
    accepted-qualities: GOOD,UNCERTAIN,BAD,STALE,SUBSTITUTED
