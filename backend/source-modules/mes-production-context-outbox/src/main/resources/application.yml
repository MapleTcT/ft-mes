server:
  port: ${MES_CONTEXT_SERVER_PORT:19082}

spring:
  application:
    name: mes-production-context-outbox
  datasource:
    url: ${MES_CONTEXT_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/adp}
    username: ${MES_CONTEXT_DATABASE_USERNAME:adp}
    password: ${MES_CONTEXT_DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MES_CONTEXT_DATABASE_POOL_SIZE:4}
      minimum-idle: 1

mes:
  production-context:
    kafka:
      bootstrap-servers: ${MES_CONTEXT_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
      client-id: ${MES_CONTEXT_KAFKA_CLIENT_ID:ft-mes-context-outbox}
    outbox:
      enabled: ${MES_CONTEXT_OUTBOX_ENABLED:false}
      topic: ${MES_CONTEXT_TOPIC:mes.production.context.v1}
      poll-delay-ms: ${MES_CONTEXT_POLL_DELAY_MS:1000}
      batch-size: ${MES_CONTEXT_BATCH_SIZE:100}
      max-attempts: ${MES_CONTEXT_MAX_ATTEMPTS:20}
      claim-timeout-ms: ${MES_CONTEXT_CLAIM_TIMEOUT_MS:120000}
      base-retry-ms: ${MES_CONTEXT_BASE_RETRY_MS:1000}
      max-retry-ms: ${MES_CONTEXT_MAX_RETRY_MS:300000}
      send-timeout-ms: ${MES_CONTEXT_SEND_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
