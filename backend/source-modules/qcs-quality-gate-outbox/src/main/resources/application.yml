server:
  port: ${QCS_BPI_OUTBOX_SERVER_PORT:19083}

spring:
  application:
    name: qcs-quality-gate-outbox
  datasource:
    url: ${QCS_BPI_OUTBOX_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/adp}
    username: ${QCS_BPI_OUTBOX_DATABASE_USERNAME:adp}
    password: ${QCS_BPI_OUTBOX_DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${QCS_BPI_OUTBOX_DATABASE_POOL_SIZE:4}
      minimum-idle: 1

qcs:
  bpi:
    outbox:
      enabled: ${QCS_BPI_OUTBOX_ENABLED:false}
      topic: ${QCS_BPI_OUTBOX_TOPIC:qcs.batch.quality-gate.v1}
      poll-delay-ms: ${QCS_BPI_OUTBOX_POLL_DELAY_MS:1000}
      batch-size: ${QCS_BPI_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${QCS_BPI_OUTBOX_MAX_ATTEMPTS:20}
      claim-timeout-ms: ${QCS_BPI_OUTBOX_CLAIM_TIMEOUT_MS:120000}
      base-retry-ms: ${QCS_BPI_OUTBOX_BASE_RETRY_MS:1000}
      max-retry-ms: ${QCS_BPI_OUTBOX_MAX_RETRY_MS:300000}
      send-timeout-ms: ${QCS_BPI_OUTBOX_SEND_TIMEOUT_MS:30000}
      bpi-base-url: ${QCS_BPI_OUTBOX_BPI_BASE_URL:http://127.0.0.1:19091}
      bpi-connect-timeout-ms: ${QCS_BPI_OUTBOX_BPI_CONNECT_TIMEOUT_MS:3000}
      bpi-read-timeout-ms: ${QCS_BPI_OUTBOX_BPI_READ_TIMEOUT_MS:5000}
      internal-jwt-secret: ${BPI_INTERNAL_JWT_SECRET:}
      internal-jwt-issuer: ${BPI_INTERNAL_JWT_ISSUER:ft-mes-adapter}
      internal-jwt-audience: ${BPI_INTERNAL_JWT_AUDIENCE:bpi-service}
      internal-jwt-subject: ${QCS_BPI_OUTBOX_JWT_SUBJECT:qcs-quality-gate-outbox}
      internal-token-ttl-seconds: ${QCS_BPI_OUTBOX_TOKEN_TTL_SECONDS:120}
      kafka-bootstrap-servers: ${QCS_BPI_OUTBOX_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
      kafka-client-id: ${QCS_BPI_OUTBOX_KAFKA_CLIENT_ID:ft-mes-qcs-quality-gate-outbox}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
