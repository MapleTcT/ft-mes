<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新建制造指令</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1677ff;
      --blue-dark: #0958d9;
      --blue-soft: #e6f4ff;
      --green: #389e0d;
      --green-soft: #f6ffed;
      --amber: #d48806;
      --amber-soft: #fffbe6;
      --red: #cf1322;
      --red-soft: #fff2f0;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d9dfe8;
      --surface: #ffffff;
      --page: #f5f7fa;
      --control-height: 40px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #246fce;
      color: #fff;
      border-bottom: 1px solid #1d5fae;
    }
    .topbar h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .topbar a { color: #fff; text-decoration: none; opacity: .92; }

    .workspace { max-width: 1180px; margin: 0 auto; padding: 20px 24px 32px; }
    .breadcrumb { margin-bottom: 14px; color: var(--muted); }
    .breadcrumb a { color: #246fce; text-decoration: none; }

    .section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .section-title h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .section-body { padding: 18px; }

    .master-row {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(360px, 2fr) auto;
      gap: 10px;
      align-items: end;
    }
    .field { min-width: 0; }
    .field label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-weight: 500;
    }
    .required::before { content: "*"; color: var(--red); margin-right: 4px; }
    input, select {
      width: 100%;
      height: var(--control-height);
      border: 1px solid #c9d1dc;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      padding: 0 11px;
      font: inherit;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(22,119,255,.12); }
    input:disabled, select:disabled { background: #f2f4f7; color: #98a2b3; }

    .detail-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 14px;
      border: 1px solid #e4e7ec;
      background: #fafbfc;
    }
    .detail-item { min-height: 66px; padding: 11px 14px; border-right: 1px solid #e4e7ec; }
    .detail-item:last-child { border-right: 0; }
    .detail-item span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .detail-item strong { display: block; overflow-wrap: anywhere; font-weight: 500; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 22px; }
    .check-row { min-height: var(--control-height); display: flex; align-items: center; }
    .check-row label { display: inline-flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; }
    .check-row input { width: 16px; height: 16px; margin: 0; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: #fafbfc;
    }
    button {
      min-width: 92px;
      height: var(--control-height);
      border: 1px solid #b8c2cf;
      border-radius: 4px;
      background: #fff;
      color: #344054;
      padding: 0 18px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--blue); color: var(--blue); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
    button:disabled { cursor: not-allowed; opacity: .58; }

    .status {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid;
      border-radius: 4px;
      line-height: 1.55;
    }
    .status.visible { display: flex; }
    .status.info { color: #0958d9; background: var(--blue-soft); border-color: #91caff; }
    .status.success { color: #237804; background: var(--green-soft); border-color: #b7eb8f; }
    .status.warning { color: #874d00; background: var(--amber-soft); border-color: #ffe58f; }
    .status.error { color: #a8071a; background: var(--red-soft); border-color: #ffccc7; }
    .status-mark { font-weight: 700; line-height: 1.45; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid #b7eb8f;
      background: var(--green-soft);
    }
    .result-grid .detail-item { border-color: #d9f7be; }
    .result-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .hidden { display: none !important; }

    @media (max-width: 780px) {
      .topbar { padding: 0 16px; }
      .workspace { padding: 14px 12px 24px; }
      .master-row, .form-grid { grid-template-columns: 1fr; }
      .detail-strip, .result-grid { grid-template-columns: 1fr 1fr; }
      .detail-item:nth-child(2) { border-right: 0; }
      .detail-item:nth-child(-n+2) { border-bottom: 1px solid #e4e7ec; }
      .actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>新建制造指令</h1>
    <a id="top-return" href="/msService/WOM/produceTask/produceTask/makeTaskList">返回列表</a>
  </header>

  <main class="workspace">
    <nav class="breadcrumb">
      <a href="/msService/WOM/produceTask/produceTask/makeTaskList">制造指令单</a>
      <span> / 新建制造指令</span>
    </nav>

    <div id="status" class="status" role="status" aria-live="polite">
      <span class="status-mark" id="status-mark"></span>
      <span id="status-text"></span>
    </div>

    <form id="entry-form" novalidate>
      <section class="section">
        <div class="section-title"><h2>生产主数据</h2></div>
        <div class="section-body">
          <div class="master-row">
            <div class="field">
              <label for="option-search">主数据搜索</label>
              <input id="option-search" data-testid="option-search" type="search" maxlength="100" placeholder="产品、配方或生产线">
            </div>
            <div class="field">
              <label class="required" for="production-option">产品 / 配方 / 生产线</label>
              <select id="production-option" data-testid="production-option" required>
                <option value="">正在加载...</option>
              </select>
            </div>
            <button id="refresh-options" type="button">查询</button>
          </div>

          <div class="detail-strip" aria-label="所选生产主数据">
            <div class="detail-item"><span>产品</span><strong id="detail-product">-</strong></div>
            <div class="detail-item"><span>配方</span><strong id="detail-formula">-</strong></div>
            <div class="detail-item"><span>生产线</span><strong id="detail-line">-</strong></div>
            <div class="detail-item"><span>生产单位</span><strong id="detail-unit">-</strong></div>
          </div>
        </div>
      </section>

      <section class="section" id="plan-section">
        <div class="section-title"><h2>计划信息</h2></div>
        <div class="section-body">
          <div class="form-grid">
            <div class="field">
              <label class="required" for="batch-code">生产批号</label>
              <input id="batch-code" data-testid="batch-code" type="text" maxlength="128" required autocomplete="off">
            </div>
            <div class="field">
              <label class="required" for="plan-num">计划数量</label>
              <input id="plan-num" data-testid="plan-num" type="number" min="0.000001" step="0.000001" value="1" required>
            </div>
            <div class="field">
              <label class="required" for="plan-start">计划开始</label>
              <input id="plan-start" data-testid="plan-start" type="datetime-local" step="1" required>
            </div>
            <div class="field">
              <label class="required" for="plan-end">计划结束</label>
              <input id="plan-end" data-testid="plan-end" type="datetime-local" step="1" required>
            </div>
            <div class="field check-row">
              <label for="need-pack"><input id="need-pack" data-testid="need-pack" type="checkbox">需要包装</label>
            </div>
          </div>
        </div>
        <div class="actions">
          <button id="reset-form" type="button">重置</button>
          <button id="submit-create" data-testid="submit-create" class="primary" type="submit">创建指令</button>
        </div>
      </section>
    </form>

    <section id="result-section" class="section hidden" aria-live="polite">
      <div class="section-title"><h2>创建结果</h2></div>
      <div class="section-body">
        <div class="result-grid">
          <div class="detail-item"><span>单据编号</span><strong id="result-table-no">-</strong></div>
          <div class="detail-item"><span>生产批号</span><strong id="result-batch">-</strong></div>
          <div class="detail-item"><span>任务 ID</span><strong id="result-task-id">-</strong></div>
          <div class="detail-item"><span>状态</span><strong id="result-status">待编辑</strong></div>
        </div>
        <div class="result-actions">
          <button id="create-another" type="button">继续新建</button>
          <button id="open-pending" data-testid="open-pending" class="primary" type="button">打开待办</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var apiBase = "/msService/WOM/produceTask/manual-entry";
      var listUrl = "/msService/WOM/produceTask/produceTask/makeTaskList";
      var state = { options: [], task: null, submitting: false };
      var elements = {
        form: document.getElementById("entry-form"),
        status: document.getElementById("status"),
        statusMark: document.getElementById("status-mark"),
        statusText: document.getElementById("status-text"),
        search: document.getElementById("option-search"),
        option: document.getElementById("production-option"),
        refresh: document.getElementById("refresh-options"),
        batchCode: document.getElementById("batch-code"),
        planNum: document.getElementById("plan-num"),
        planStart: document.getElementById("plan-start"),
        planEnd: document.getElementById("plan-end"),
        needPack: document.getElementById("need-pack"),
        reset: document.getElementById("reset-form"),
        submit: document.getElementById("submit-create"),
        planSection: document.getElementById("plan-section"),
        resultSection: document.getElementById("result-section"),
        openPending: document.getElementById("open-pending"),
        createAnother: document.getElementById("create-another")
      };

      function pad(value) { return String(value).padStart(2, "0"); }

      function localInputValue(date) {
        return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
          + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
      }

      function apiDate(value) {
        return value ? value.replace("T", " ") : "";
      }

      function defaultBatchCode() {
        var marker = new URLSearchParams(window.location.search).get("marker");
        if (marker) { return marker.slice(0, 128); }
        var now = new Date();
        return "MANUAL_" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
          + "_" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      }

      function resetDefaults() {
        var start = new Date();
        start.setMilliseconds(0);
        var end = new Date(start.getTime() + 60 * 60 * 1000);
        elements.batchCode.value = defaultBatchCode();
        elements.planNum.value = "1";
        elements.planStart.value = localInputValue(start);
        elements.planEnd.value = localInputValue(end);
        elements.needPack.checked = false;
      }

      function status(type, message) {
        elements.status.className = "status visible " + type;
        elements.statusMark.textContent = type === "success" ? "✓" : type === "error" ? "×" : "!";
        elements.statusText.textContent = message;
      }

      function clearStatus() {
        elements.status.className = "status";
        elements.statusText.textContent = "";
      }

      function loginTicket() {
        return localStorage.getItem("ticket")
          || localStorage.getItem("suposTicket")
          || localStorage.getItem("SUPOS_TICKET")
          || localStorage.getItem("token");
      }

      function requestHeaders(extraHeaders) {
        var headers = Object.assign(
          { "Accept": "application/json" },
          extraHeaders || {}
        );
        var ticket = loginTicket();
        if (ticket && !headers.Authorization) {
          headers.Authorization = ticket.indexOf("Bearer ") === 0
            ? ticket
            : "Bearer " + ticket;
        }
        return headers;
      }

      async function requestJson(url, options) {
        var requestOptions = Object.assign(
          { credentials: "same-origin" },
          options || {}
        );
        requestOptions.headers = requestHeaders(options && options.headers);
        var response = await fetch(url, requestOptions);
        var text = await response.text();
        var payload;
        try { payload = JSON.parse(text); } catch (_error) { payload = null; }
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            throw new Error("登录状态已失效，请返回系统重新登录");
          }
          throw new Error("请求失败（HTTP " + response.status + "）");
        }
        if (!payload || Number(payload.code) !== 200) {
          throw new Error(payload && (payload.message || payload.msg) || "服务未返回有效结果");
        }
        return payload.data;
      }

      function selectedOption() {
        var index = Number(elements.option.value);
        return Number.isInteger(index) && state.options[index] ? state.options[index] : null;
      }

      function optionLabel(item) {
        var label = [
          item.productCode + " " + (item.productName || ""),
          item.formulaCode + " " + (item.formulaName || ""),
          item.lineCode + " " + (item.lineName || "")
        ].join(" / ");
        return item.eligible ? label : label + "（" + (item.issue || "不可用") + "）";
      }

      function renderOptions() {
        elements.option.textContent = "";
        var placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = state.options.length ? "请选择生产主数据" : "没有可用的生产主数据";
        elements.option.appendChild(placeholder);
        state.options.forEach(function (item, index) {
          var option = document.createElement("option");
          option.value = String(index);
          option.textContent = optionLabel(item);
          option.disabled = !item.eligible;
          elements.option.appendChild(option);
        });
        var firstEligible = state.options.findIndex(function (item) { return item.eligible; });
        if (firstEligible >= 0) {
          elements.option.value = String(firstEligible);
        }
        updateDetails();
      }

      function updateDetails() {
        var item = selectedOption();
        document.getElementById("detail-product").textContent = item
          ? item.productCode + " / " + (item.productName || "-") : "-";
        document.getElementById("detail-formula").textContent = item
          ? item.formulaCode + " / " + (item.formulaName || "-") : "-";
        document.getElementById("detail-line").textContent = item
          ? item.lineCode + " / " + (item.lineName || "-") : "-";
        document.getElementById("detail-unit").textContent = item && item.eligible
          ? (item.unitName || item.unitSymbol || String(item.unitId)) : "未配置";
      }

      async function loadOptions() {
        elements.refresh.disabled = true;
        elements.option.disabled = true;
        try {
          var keyword = elements.search.value.trim();
          state.options = await requestJson(apiBase + "/options?limit=100&keyword=" + encodeURIComponent(keyword));
          renderOptions();
          var eligibleCount = state.options.filter(function (item) { return item.eligible; }).length;
          if (!eligibleCount) {
            status("warning", "当前没有已配置生产单位的产品 / 配方 / 生产线组合");
          } else {
            clearStatus();
          }
        } catch (error) {
          state.options = [];
          renderOptions();
          status("error", error.message || "生产主数据加载失败");
        } finally {
          elements.refresh.disabled = false;
          elements.option.disabled = false;
        }
      }

      function validate() {
        var item = selectedOption();
        if (!item || !item.eligible) { throw new Error("请选择可用的产品 / 配方 / 生产线组合"); }
        var batchCode = elements.batchCode.value.trim();
        if (!batchCode) { throw new Error("生产批号不能为空"); }
        var planNum = Number(elements.planNum.value);
        if (!Number.isFinite(planNum) || planNum <= 0) { throw new Error("计划数量必须大于 0"); }
        var start = new Date(elements.planStart.value);
        var end = new Date(elements.planEnd.value);
        if (!elements.planStart.value || !elements.planEnd.value || Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
          throw new Error("计划开始和结束时间不能为空");
        }
        if (end.getTime() <= start.getTime()) { throw new Error("计划结束时间必须晚于开始时间"); }
        return { item: item, batchCode: batchCode, planNum: elements.planNum.value };
      }

      function requestId() {
        return "WOM-MANUAL-" + Date.now() + "-" + Math.random().toString(16).slice(2, 10);
      }

      function setSubmitting(submitting) {
        state.submitting = submitting;
        elements.submit.disabled = submitting;
        elements.reset.disabled = submitting;
        elements.submit.textContent = submitting ? "正在创建..." : "创建指令";
      }

      function safePendingUrl(task) {
        var fallback = task.pendingId
          ? "/msService/WOM/produceTask/produceTask/makeTaskEdit?pendingId=" + encodeURIComponent(task.pendingId)
            + "&entityCode=WOM_1.0.0_produceTask&viewCode=WOM_1.0.0_produceTask_makeTaskEdit"
          : listUrl;
        if (!task.pendingOpenUrl) { return fallback; }
        try {
          var parsed = new URL(task.pendingOpenUrl, window.location.origin);
          if (parsed.origin !== window.location.origin || parsed.pathname.indexOf("/msService/WOM/produceTask/") !== 0) {
            return fallback;
          }
          return parsed.pathname + parsed.search + parsed.hash;
        } catch (_error) {
          return fallback;
        }
      }

      function showResult(result) {
        state.task = result.task;
        document.getElementById("result-table-no").textContent = result.task.tableNo || "-";
        document.getElementById("result-batch").textContent = result.task.batchCode || "-";
        document.getElementById("result-task-id").textContent = String(result.task.taskId || "-");
        document.getElementById("result-status").textContent = result.idempotent ? "已存在（幂等返回）" : "待编辑";
        elements.planSection.classList.add("hidden");
        elements.resultSection.classList.remove("hidden");
        elements.openPending.disabled = !result.task.pendingId;
        status("success", result.idempotent ? "该请求已创建，已返回原制造指令" : "制造指令已创建并进入编辑待办");
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: "adp-wom-manual-task-created", taskId: result.task.taskId }, window.location.origin);
        }
      }

      async function submit(event) {
        event.preventDefault();
        if (state.submitting) { return; }
        try {
          var values = validate();
          setSubmitting(true);
          status("info", "正在创建制造指令并核对 PostgreSQL 落库结果...");
          var payload = {
            requestId: requestId(),
            productCode: values.item.productCode,
            formulaCode: values.item.formulaCode,
            workLineId: values.item.lineId,
            planNum: Number(values.planNum),
            planStartDate: apiDate(elements.planStart.value),
            planEndDate: apiDate(elements.planEnd.value),
            batchCode: values.batchCode,
            needPack: elements.needPack.checked
          };
          var result = await requestJson(apiBase + "/create", {
            method: "POST",
            headers: { "Accept": "application/json", "Content-Type": "application/json;charset=UTF-8" },
            body: JSON.stringify(payload)
          });
          showResult(result);
        } catch (error) {
          status("error", error.message || "制造指令创建失败");
        } finally {
          setSubmitting(false);
        }
      }

      elements.form.addEventListener("submit", submit);
      elements.option.addEventListener("change", updateDetails);
      elements.refresh.addEventListener("click", loadOptions);
      elements.search.addEventListener("keydown", function (event) {
        if (event.key === "Enter") { event.preventDefault(); loadOptions(); }
      });
      elements.reset.addEventListener("click", function () { resetDefaults(); clearStatus(); });
      elements.openPending.addEventListener("click", function () {
        if (state.task) { window.location.href = safePendingUrl(state.task); }
      });
      elements.createAnother.addEventListener("click", function () {
        state.task = null;
        elements.resultSection.classList.add("hidden");
        elements.planSection.classList.remove("hidden");
        resetDefaults();
        clearStatus();
      });

      resetDefaults();
      loadOptions();
    })();
  </script>
</body>
</html>
