spring:
  datasource:
    url: jdbc:h2:mem:process_analysis;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
    schema: classpath:process-analysis-test-schema.sql
  cloud:
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false

management:
  health:
    defaults:
      enabled: false
