spring:
  datasource:
    url: jdbc:h2:mem:material_wms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
