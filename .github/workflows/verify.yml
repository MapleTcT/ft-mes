name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-verify:
    name: Maven and Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version
          docker compose version

      - name: Run repository gate
        run: make ci

  bpi-java17-postgres:
    name: BPI Java 17 and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ft_mes_bpi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bpi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ft_mes_bpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BPI_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ft_mes_bpi
      BPI_TEST_DATABASE_USER: postgres
      BPI_TEST_DATABASE_PASSWORD: bpi-ci-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test BPI contracts and real PostgreSQL service slice
        run: make bpi-contracts-test bpi-api-contract-check bpi-service-test
