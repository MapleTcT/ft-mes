name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-verify:
    name: Maven and Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version
          docker compose version

      - name: Run repository gate
        run: make ci

  bpi-java17-postgres:
    name: BPI Java 17 and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ft_mes_bpi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bpi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ft_mes_bpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BPI_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ft_mes_bpi
      BPI_TEST_DATABASE_USER: postgres
      BPI_TEST_DATABASE_PASSWORD: bpi-ci-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test BPI contracts, runtime replay, streaming semantics and real PostgreSQL service slice
        run: make ci-java17

  bpi-dataset-materializer:
    name: BPI Python 3.12 dataset materializer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/bpi-dataset-materializer/requirements.runtime.txt

      - name: Install locked runtime and package
        run: |
          python -m pip install --requirement services/bpi-dataset-materializer/requirements.runtime.txt
          python -m pip install --no-build-isolation --no-deps services/bpi-dataset-materializer

      - name: Test deterministic Parquet and versioned object contract
        run: make bpi-dataset-materializer-test PYTHON=python

      - name: Build non-root runtime image
        run: |
          docker build \
            --build-arg PYTHON_IMAGE=python:3.12.13-slim-bookworm \
            --file services/bpi-dataset-materializer/Dockerfile \
            --tag ft-mes-bpi-dataset-materializer:ci .
          test "$(docker image inspect --format '{{.Config.User}}' ft-mes-bpi-dataset-materializer:ci)" = "10001:10001"

  bpi-ui-node20:
    name: BPI console and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/apps/bpi/package-lock.json

      - name: Install audited UI dependencies
        working-directory: frontend/apps/bpi
        run: npm ci --no-fund

      - name: Audit and build BPI console
        working-directory: frontend/apps/bpi
        run: npm audit --audit-level=moderate && npm run build

      - name: Install Chromium
        working-directory: frontend/apps/bpi
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile operator acceptance
        working-directory: frontend/apps/bpi
        run: npm run test:e2e
